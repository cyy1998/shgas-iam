packages:
  - "apps/*"
  - "e2e/system"
  - "packages/*"
trustLockfile: true
verifyDepsBeforeRun: error
overrides:
  "@types/node": "25.9.1"
  "@types/react": "19.2.17"
  "@types/react-dom": "19.2.3"
  "@typescript/typescript6@6.0.2>@typescript/old": "npm:typescript@6.0.2"
  "@typescript/native": "npm:typescript@7.0.2"
  typescript: "npm:@typescript/typescript6@6.0.2"
allowBuilds:
  bcrypt: true
  esbuild: true
  msgpackr-extract: true
  msw: false
  nice-napi: true
ignoredBuiltDependencies:
  - "@prisma/engines"
  - "@scarf/scarf"
  - prisma
  - prisma-zod-generator
patchedDependencies:
  "@ai-hero/sandcastle@0.12.0": patches/@ai-hero__sandcastle@0.12.0.patch
