# Synthetic APISIX instance owned by Full-system E2E.
deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  admin:
    admin_api_version: v3
    admin_listen:
      ip: 0.0.0.0
      port: 9180
    allow_admin:
      - 0.0.0.0/0
    admin_key:
      - name: e2e
        key: dev-local-admin-key-change-me
        role: admin
  etcd:
    host:
      - http://apisix-etcd:2379

apisix:
  node_listen: 9080
  enable_admin: true

plugins:
  - request-id
  - opentelemetry
  - proxy-rewrite
  - redirect
  - cors

plugin_attr:
  opentelemetry:
    set_ngx_var: true
    collector:
      address: 127.0.0.1:9
      request_timeout: 1
