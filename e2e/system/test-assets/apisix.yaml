# Synthetic APISIX instance owned by Full-system E2E.
deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  admin:
    admin_api_version: v3
    admin_listen:
      ip: 0.0.0.0
      port: 9180
    allow_admin:
      - 0.0.0.0/0
    admin_key:
      - name: e2e
        key: dev-local-admin-key-change-me
        role: admin
  etcd:
    host:
      - http://apisix-etcd:2379

apisix:
  node_listen: 9080
  enable_admin: true
  ssl:
    enable: true
    listen:
      - port: 9443

nginx_config:
  worker_processes: 2
  # NGINX error log entries may include the full request line, including OAuth parameters.
  error_log_level: crit
  http_configuration_snippet: |
    map $uri $iam_log_path {
      default $uri;
      ~^/sso/wechat-qr/mobile/confirm/[^/]+/?$ /sso/wechat-qr/mobile/confirm/:flowId;
      ~^/sso/wechat-qr/mobile/(callback|decision)$ $uri;
      ~^/sso/wechat-qr/mobile/[^/]+/?$ /sso/wechat-qr/mobile/:requestId;
      ~^/(?<qr_protocol>sso|oidc)/wechat-qr/[^/]+/(?<qr_action>events|complete|bind/(?:password|sms(?:/send)?))/?$ /${qr_protocol}/wechat-qr/:requestId/${qr_action};
      ~^/sso/wechat-qr/ /sso/wechat-qr/*;
      ~^/oidc/wechat-qr/ /oidc/wechat-qr/*;
    }
  http:
    access_log_format: '$remote_addr [$time_local] $http_host "$request_method $iam_log_path" $status $request_time "$apisix_request_id"'

plugins:
  - request-id
  - opentelemetry
  - proxy-rewrite
  - redirect
  - cors

plugin_attr:
  opentelemetry:
    set_ngx_var: true
    collector:
      address: 127.0.0.1:9
      request_timeout: 1
