# Synthetic APISIX instance owned by Full-system E2E.
deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  admin:
    admin_api_version: v3
    admin_listen:
      ip: ${{IAM_E2E_APISIX_LISTEN_IP:=0.0.0.0}}
      port: ${{IAM_E2E_APISIX_ADMIN_PORT:=9180}}
    allow_admin:
      - 0.0.0.0/0
    admin_key:
      - name: e2e
        key: dev-local-admin-key-change-me
        role: admin
  etcd:
    host:
      - ${{IAM_E2E_APISIX_ETCD_URL:=http://apisix-etcd:2379}}

apisix:
  node_listen:
    - ip: ${{IAM_E2E_APISIX_LISTEN_IP:=0.0.0.0}}
      port: ${{IAM_E2E_APISIX_HTTP_PORT:=9080}}
  enable_admin: true
  # The internal control API defaults to a fixed port shared by all host-network projects.
  enable_control: false
  ssl:
    enable: true
    listen:
      - ip: ${{IAM_E2E_APISIX_LISTEN_IP:=0.0.0.0}}
        port: ${{IAM_E2E_APISIX_HTTPS_PORT:=9443}}

nginx_config:
  worker_processes: 2
  # Error records can contain the original request line. Keep them in container memory
  # and let the failure reporter redact them before writing the persistent summary.
  error_log: /dev/shm/iam-e2e-apisix-error.log
  error_log_level: warn
  http_configuration_snippet: |
    map $uri $iam_log_path {
      default $uri;
      ~^/sso/wechat-qr/mobile/confirm/[^/]+/?$ /sso/wechat-qr/mobile/confirm/:flowId;
      ~^/sso/wechat-qr/mobile/(callback|decision)$ $uri;
      ~^/sso/wechat-qr/mobile/[^/]+/?$ /sso/wechat-qr/mobile/:requestId;
      ~^/api/iam/auth/wechat-qr/[^/]+/(?<qr_action>status|events|complete|bind/(?:password|sms(?:/send)?))/?$ /api/iam/auth/wechat-qr/:requestId/${qr_action};
      ~^/api/iam/auth/wechat-qr/ /api/iam/auth/wechat-qr/*;
      ~^/sso/thirdparty/ /sso/thirdparty/:clientCode;
      ~^/sso/wechat-qr/ /sso/wechat-qr/*;
      ~^/oidc/wechat-qr/ /oidc/wechat-qr/*;
    }
  http:
    access_log_format: '$remote_addr [$time_local] $http_host "$request_method $iam_log_path" $status $request_time "$apisix_request_id"'

plugins:
  - request-id
  - opentelemetry
  - proxy-rewrite
  - redirect
  - cors

plugin_attr:
  opentelemetry:
    set_ngx_var: true
    collector:
      address: 127.0.0.1:9
      request_timeout: 1
