upstreams:
  - id: iam-api-prod
    name: iam-api-prod
    desc: IAM public API upstream for production
    type: roundrobin
    scheme: http
    pass_host: pass
    nodes:
      ${IAM_API_UPSTREAM_HOST}:${IAM_API_UPSTREAM_PORT}: 1
    labels:
      managed_by: shgas-iam
      source: repo-manifest
      env: prod
      app: iam

  - id: iam-admin-api-prod
    name: iam-admin-api-prod
    desc: IAM admin API upstream for production
