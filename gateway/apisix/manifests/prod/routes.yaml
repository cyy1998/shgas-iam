routes:
  - id: iam-sso-frontend-prod
    name: iam-sso-frontend-prod
    desc: IAM SSO frontend through APISIX
    uris:
      - /portal
      - /portal/*
    service_id: iam-sso-frontend-prod
    labels:
      managed_by: shgas-iam
      source: repo-manifest
      env: prod

  - id: iam-admin-frontend-prod
    name: iam-admin-frontend-prod
    desc: IAM admin frontend through APISIX
    uris:
      - /iam-admin
      - /iam-admin/*
    service_id: iam-admin-frontend-prod
    labels:
      managed_by: shgas-iam
      source: repo-manifest
      env: prod

  - id: iam-public-prod
    name: iam-public-prod
    desc: IAM public tier through APISIX with /api/iam prefix
    uri: /api/iam/public/*
    service_id: iam-api-prod
    plugins:
      proxy-rewrite:
        regex_uri:
          - ^/api/iam/(.*)
          - /$1
        use_real_request_uri_unsafe: false
    labels:
      managed_by: shgas-iam
      source: repo-manifest
      env: prod

  - id: iam-open-prod
    name: iam-open-prod
    desc: IAM open tier through APISIX with /api/iam prefix
    uri: /api/iam/open/*
    service_id: iam-api-prod
    plugins:
      proxy-rewrite:
        regex_uri:
          - ^/api/iam/(.*)
          - /$1
        use_real_request_uri_unsafe: false
    labels:
      managed_by: shgas-iam
      source: repo-manifest
      env: prod

  - id: iam-internal-prod
    name: iam-internal-prod
    desc: IAM internal tier through APISIX with /api/iam prefix
    uri: /api/iam/internal/*
    service_id: iam-api-prod
    plugins:
      proxy-rewrite:
        regex_uri:
          - ^/api/iam/(.*)
          - /$1
        use_real_request_uri_unsafe: false
    labels:
      managed_by: shgas-iam
      source: repo-manifest
      env: prod

  - id: iam-sso-prod
    name: iam-sso-prod
    desc: IAM SSO tier through APISIX with /api/iam prefix
    uri: /sso/*
    service_id: iam-api-prod
    plugin_config_id: iam-sso-cors-prod
    labels:
      managed_by: shgas-iam
      source: repo-manifest
      env: prod

  - id: iam-auth-prod
    name: iam-auth-prod
    desc: IAM auth tier through APISIX with /api/iam prefix
    uri: /api/iam/auth/*
    service_id: iam-api-prod
    plugins:
      proxy-rewrite:
        regex_uri:
          - ^/api/iam/(.*)
          - /$1
        use_real_request_uri_unsafe: false
    labels:
      managed_by: shgas-iam
      source: repo-manifest
      env: prod

  - id: iam-admin-rest-prod
    name: iam-admin-rest-prod
    desc: IAM admin REST tier through APISIX with /api/iam prefix
    uri: /api/iam/admin/*
    service_id: iam-admin-api-prod
    plugins:
      proxy-rewrite:
        regex_uri:
          - ^/api/iam/(.*)
          - /$1
        use_real_request_uri_unsafe: false
    labels:
      managed_by: shgas-iam
