      env: prod

  - id: iam-admin-rpc-prod
    name: iam-admin-rpc-prod
    desc: IAM admin RPC tier through APISIX with /api/iam prefix
    uri: /api/iam/rpc/*
    service_id: iam-admin-api-prod
