routes:
  - id: gds-frontend-prod
    name: gds-frontend-prod
    uris:
      - /data-platform
      - /data-platform/*
    service_id: gds-api-prod
    priority: 0
    status: 1
    enable_websocket: false
    labels:
      managed_by: shgas-iam
      source: repo-manifest
      env: prod
      app: gds

  - id: gds-api-prod
    name: gds-api-prod
    uri: /api/v1/*
    service_id: gds-api-prod
    plugins:
      forward-auth:
        uri: http://localhost/api/iam/auth/authz
        allow_degradation: false
        client_headers:
          - Forbidden-Reason
        keepalive: true
        keepalive_pool: 5
        keepalive_timeout: 60000
        request_headers:
          - Cookie
          - Client
        request_method: GET
        ssl_verify: false
        status_on_error: 403
        timeout: 3000
        upstream_headers:
          - X-User-Info
    priority: 0
    status: 1
    enable_websocket: false
    labels:
      managed_by: shgas-iam
      source: repo-manifest
      env: prod
      app: gds
  - id: gds-no-login-prod
    name: gds-no-login-prod
    uri: /api/v1/dashboard/oa_portal
    service_id: gds-api-prod
    priority: 0
    status: 1
    enable_websocket: false
    labels:
      managed_by: shgas-iam
      source: repo-manifest
      env: prod
      app: gds
