routes:
  - id: iam-public-dev
    name: iam-public-dev
    desc: IAM public tier through APISIX
    uri: /public/*
    service_id: iam-api-dev
    labels:
      managed_by: shgas-iam
      source: repo-manifest
      env: dev

  - id: iam-open-dev
    name: iam-open-dev
    desc: IAM open tier through APISIX
    uri: /open/*
    service_id: iam-api-dev
    labels:
      managed_by: shgas-iam
      source: repo-manifest
      env: dev

  - id: iam-internal-dev
    name: iam-internal-dev
    desc: IAM internal tier through APISIX
    uri: /internal/*
    service_id: iam-api-dev
    labels:
      managed_by: shgas-iam
      source: repo-manifest
      env: dev

  - id: iam-sso-dev
    name: iam-sso-dev
    desc: IAM SSO tier through APISIX
    uri: /sso/*
    service_id: iam-api-dev
    plugin_config_id: iam-open-cors-dev
    labels:
      managed_by: shgas-iam
      source: repo-manifest
      env: dev

  - id: iam-auth-dev
    name: iam-auth-dev
    desc: IAM auth tier through APISIX
    uri: /auth/*
    service_id: iam-api-dev
    labels:
      managed_by: shgas-iam
      source: repo-manifest
      env: dev

  - id: iam-api-compat-dev
    name: iam-api-compat-dev
    desc: Compatibility route matching the current /api/iam/* APISIX prefix
    uri: /api/iam/*
    service_id: iam-api-dev
    plugins:
      proxy-rewrite:
        regex_uri:
          - ^/api/iam/(.*)
          - /$1
        use_real_request_uri_unsafe: false
    labels:
      managed_by: shgas-iam
      source: repo-manifest
      env: dev

  - id: iam-admin-rest-dev
    name: iam-admin-rest-dev
    desc: IAM admin REST tier through APISIX
    uri: /admin/*
    service_id: iam-admin-api-dev
    labels:
      managed_by: shgas-iam
      source: repo-manifest
      env: dev

  - id: iam-admin-rpc-dev
    name: iam-admin-rpc-dev
    desc: IAM admin RPC tier through APISIX
    uri: /rpc/*
    service_id: iam-admin-api-dev
    labels:
      managed_by: shgas-iam
      source: repo-manifest
      env: dev

  - id: iam-admin-rest-compat-dev
    name: iam-admin-rest-compat-dev
    desc: Compatibility route for /api/iam/admin/*
    uri: /api/iam/admin/*
    service_id: iam-admin-api-dev
    plugins:
      proxy-rewrite:
        regex_uri:
          - ^/api/iam/(.*)
          - /$1
        use_real_request_uri_unsafe: false
    labels:
      managed_by: shgas-iam
      source: repo-manifest
      env: dev

  - id: iam-admin-rpc-compat-dev
    name: iam-admin-rpc-compat-dev
    desc: Compatibility route for /api/iam/rpc/*
    uri: /api/iam/rpc/*
    service_id: iam-admin-api-dev
    plugins:
      proxy-rewrite:
        regex_uri:
          - ^/api/iam/(.*)
          - /$1
        use_real_request_uri_unsafe: false
    labels:
      managed_by: shgas-iam
      source: repo-manifest
      env: dev
