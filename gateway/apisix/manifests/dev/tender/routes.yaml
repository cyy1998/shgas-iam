routes:
  - id: tender-api-dev
    name: tender-api-dev
    uri: /api/tender/*
    service_id: tender-api-dev
    plugins:
      forward-auth:
        uri: http://176.169.99.191:9080/api/iam/auth/authz
        allow_degradation: false
        client_headers:
          - Forbidden-Reason
        extra_headers:
          Client: tender
        keepalive: true
        keepalive_pool: 5
        keepalive_timeout: 60000
        request_headers:
          - Cookie
          - Client
          - Authorization
        request_method: GET
        ssl_verify: false
        status_on_error: 403
        timeout: 3000
        upstream_headers:
          - X-User-Info
    priority: 0
    status: 1
    enable_websocket: false
    labels:
      managed_by: shgas-iam
      source: repo-manifest
      env: dev
      app: tender
  - id: tender-public-dev
    name: tender-public-dev
    uris:
      - /api/tender/public/*
      - /api/tender/weaver/*
    service_id: tender-api-dev
    priority: 0
    status: 1
    enable_websocket: false
    labels:
      managed_by: shgas-iam
      source: repo-manifest
      env: dev
      app: tender
  - id: tender-thirdparty-dev
    name: tender-thirdparty-dev
    uri: /thirdparty/tender/*
    service_id: tender-api-dev
    plugins:
      forward-auth:
        uri: http://176.169.99.191:9080/api/iam/auth/internal-authz
        allow_degradation: false
        client_headers:
          - Forbidden-Reason
        keepalive: true
        keepalive_pool: 5
        keepalive_timeout: 60000
        request_headers:
          - Cookie
          - apikey
          - IP-Chain
          - Authorization
        request_method: GET
        ssl_verify: false
        status_on_error: 403
        timeout: 3000
        upstream_headers: {}
      proxy-rewrite:
        regex_uri:
          - ^/thirdparty/tender/(.*)
          - /thirdparty/$1
        use_real_request_uri_unsafe: false
    priority: 0
    status: 1
    enable_websocket: false
    labels:
      managed_by: shgas-iam
      source: repo-manifest
      env: dev
      app: tender
