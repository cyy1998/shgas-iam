routes:
  - id: "00000000000000000696"
    name: /test/gds
    uri: /api/v1/*
    service_id: "00000000000000000677"
    plugins:
      forward-auth:
        uri: http://176.169.99.95:9080/api/iam/auth/authz
        allow_degradation: false
        client_headers:
          - Forbidden-Reason
        keepalive: true
        keepalive_pool: 5
        keepalive_timeout: 60000
        request_headers:
          - Cookie
          - Client
          - Authorization
        request_method: GET
        ssl_verify: false
        status_on_error: 403
        timeout: 3000
        upstream_headers:
          - X-User-Info
    priority: 0
    status: 1
    enable_websocket: false
    labels:
      managed_by: shgas-iam
      source: repo-manifest
      env: dev
      app: gds
  - id: "00000000000000000883"
    name: /test/gds/no-login
    uri: /api/v1/dashboard/oa_portal
    service_id: "00000000000000000677"
    priority: 0
    status: 1
    enable_websocket: false
    labels:
      managed_by: shgas-iam
      source: repo-manifest
      env: dev
      app: gds
