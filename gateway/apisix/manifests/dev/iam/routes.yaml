routes:
  - id: iam-sso-frontend-dev
    name: iam-sso-frontend-dev
    desc: IAM SSO frontend through APISIX
    uris:
      - /portal
      - /portal/*
    service_id: iam-sso-frontend-dev
    labels:
      managed_by: shgas-iam
      source: repo-manifest
      env: dev
      app: iam

  - id: iam-admin-frontend-dev
    name: iam-admin-frontend-dev
    desc: IAM admin frontend through APISIX
    uris:
      - /iam-admin
      - /iam-admin/*
    service_id: iam-admin-frontend-dev
    labels:
      managed_by: shgas-iam
      source: repo-manifest
      env: dev
      app: iam

  - id: iam-public-dev
    name: iam-public-dev
    desc: IAM public tier through APISIX with /api/iam prefix
    uri: /api/iam/public/*
    service_id: iam-api-dev
    plugin_config_id: iam-api-ip-rate-limit-dev
    plugins:
      proxy-rewrite:
        regex_uri:
          - ^/api/iam/(.*)
          - /$1
        use_real_request_uri_unsafe: false
    labels:
      managed_by: shgas-iam
      source: repo-manifest
      env: dev
      app: iam

  - id: iam-open-dev
