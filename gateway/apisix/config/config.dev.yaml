deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  admin:
    allow_admin:
      - 0.0.0.0/0
    admin_key:
      - name: admin
        key: dev-local-admin-key-change-me
        role: admin
      - name: viewer
        key: dev-local-viewer-key-change-me
        role: viewer
  etcd:
    host:
      - http://apisix-etcd:2379

apisix:
  node_listen: 9080
  enable_admin: true
  enable_admin_cors: true
  ssl:
    enable: true
    listen:
      - port: 9443

plugin_attr:
  prometheus:
    export_uri: /apisix/prometheus/metrics
