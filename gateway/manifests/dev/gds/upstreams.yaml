upstreams:
  - id: gds-frontend-dev
    name: gds-frontend-dev
    type: roundrobin
    scheme: http
    pass_host: pass
    hash_on: vars
    tls:
      verify: false
    nodes:
      "${DEV_GDS_FRONTEND_UPSTREAM_HOST}:${DEV_GDS_FRONTEND_UPSTREAM_PORT}": 0
    labels:
      managed_by: shgas-iam
      source: repo-manifest
      env: dev
      app: gds

  - id: gds-api-dev
    name: gds-api-dev
    type: roundrobin
    scheme: http
    pass_host: pass
    hash_on: vars
    tls:
      verify: false
    nodes:
      "${DEV_GDS_API_UPSTREAM_HOST}:${DEV_GDS_API_UPSTREAM_PORT}": 0
    labels:
      managed_by: shgas-iam
      source: repo-manifest
      env: dev
      app: gds

  - id: gds-dashboard-dev
    name: gds-dashboard-dev
    type: roundrobin
    scheme: http
    pass_host: pass
    hash_on: vars
    timeout:
      connect: 300
      read: 300
      send: 300
    tls:
      verify: false
    nodes:
      "${DEV_GDS_DASHBOARD_UPSTREAM_HOST}:${DEV_GDS_DASHBOARD_UPSTREAM_PORT}": 0
    labels:
      managed_by: shgas-iam
      source: repo-manifest
      env: dev
      app: gds
