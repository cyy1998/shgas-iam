upstreams:
  - id: iam-api-dev
    name: iam-api-dev
    desc: IAM public API upstream for local development
    type: roundrobin
    scheme: http
    pass_host: pass
    nodes:
      "${DEV_IAM_API_UPSTREAM_HOST}:${DEV_IAM_API_UPSTREAM_PORT}": 1
    labels:
      managed_by: shgas-iam
      source: repo-manifest
      env: dev
      app: iam

  - id: iam-admin-api-dev
    name: iam-admin-api-dev
    desc: IAM admin API upstream for local development
