services:
  - id: tender-frontend-dev
    name: tender-frontend-dev
    upstream_id: tender-frontend-dev
    enable_websocket: false
    labels:
      managed_by: shgas-iam
      source: repo-manifest
      env: dev
      app: tender
  - id: tender-api-dev
    name: tender-api-dev
    upstream_id: tender-api-dev
    plugins:
      proxy-rewrite:
        regex_uri:
          - ^/api/tender/(.*)
          - /$1
        use_real_request_uri_unsafe: false
    enable_websocket: false
    labels:
      managed_by: shgas-iam
      source: repo-manifest
      env: dev
      app: tender
