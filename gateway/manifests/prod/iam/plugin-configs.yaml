plugin_configs:
  - id: iam-oidc-provider-ip-rate-limit-prod
    desc: IAM OIDC provider real IP and base rate limit for production
    plugins:
      real-ip:
        source: http_x_real_ip
        trusted_addresses:
          - ${TENCENT_NGINX_TRUSTED_CIDR}
        recursive: true
      limit-req:
        rate: 20
        burst: 40
        rejected_code: 429
        key_type: var
        key: remote_addr
        policy: local
    labels:
      managed_by: shgas-iam
      source: repo-manifest
      env: prod
      app: iam
      template: oidc-provider-ip-rate-limit

  - id: iam-api-ip-rate-limit-prod
    desc: IAM ordinary API IP smooth rate limit for production APISIX
    plugins:
      real-ip:
        source: http_x_real_ip
        trusted_addresses:
          - ${TENCENT_NGINX_TRUSTED_CIDR}
        recursive: true
      limit-req:
        rate: 10
        burst: 20
        rejected_code: 429
        key_type: var
        key: remote_addr
        policy: local
    labels:
      managed_by: shgas-iam
      source: repo-manifest
      env: prod
      app: iam
      template: api-ip-rate-limit

  - id: iam-sso-api-plugin-prod
    desc: IAM SSO API CORS, real IP and IP smooth rate limit for production APISIX
    plugins:
      real-ip:
        source: http_x_real_ip
        trusted_addresses:
          - ${TENCENT_NGINX_TRUSTED_CIDR}
        recursive: true
      limit-req:
        rate: 10
        burst: 20
        rejected_code: 429
        key_type: var
        key: remote_addr
        policy: local
      cors:
        allow_credential: false
        allow_headers: "*"
        allow_methods: "*"
        allow_origins: "*"
        max_age: 5
    labels:
      managed_by: shgas-iam
      source: repo-manifest
      env: prod
      app: iam
      template: sso-api-plugin

  - id: iam-internal-api-ip-rate-limit-prod
    desc: IAM internal API relaxed IP smooth rate limit for production APISIX
    plugins:
      real-ip:
        source: http_x_real_ip
        trusted_addresses:
          - ${TENCENT_NGINX_TRUSTED_CIDR}
        recursive: true
      limit-req:
        rate: 50
        burst: 100
        rejected_code: 429
        key_type: var
        key: remote_addr
        policy: local
    labels:
      managed_by: shgas-iam
      source: repo-manifest
      env: prod
      app: iam
      template: internal-api-ip-rate-limit
