deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  admin:
    allow_admin:
      - 0.0.0.0/0
    admin_key:
      - name: admin
        key: dev-local-admin-key-change-me
        role: admin
      - name: viewer
        key: dev-local-viewer-key-change-me
        role: viewer
  etcd:
    host:
      - http://apisix-etcd:2379

apisix:
  node_listen: 9080
  enable_admin: true
  enable_admin_cors: true
  ssl:
    enable: true
    listen:
      - port: 9443

plugins:
  - request-id
  - real-ip
  - limit-req
  - cors
  - proxy-rewrite
  - prometheus
  - redirect
  - forward-auth
  - key-auth
  - opentelemetry
  - client-control

nginx_config:
  http:
    access_log: /dev/stdout
    access_log_format_escape: json
    access_log_format: '{"event":"gateway.request.completed","sourceApp":"apisix","requestId":"$sent_http_x_request_id","traceId":"$opentelemetry_trace_id","spanId":"$opentelemetry_span_id","traceparent":"$opentelemetry_context_traceparent","method":"$request_method","path":"$uri","statusCode":$status,"durationMs":$request_time,"upstreamStatus":"$upstream_status","upstreamAddr":"$upstream_addr","clientIp":"$remote_addr","userAgent":"$http_user_agent"}'

plugin_attr:
  prometheus:
    export_uri: /apisix/prometheus/metrics
  opentelemetry:
    set_ngx_var: true
    resource:
      service.name: shgas-iam-apisix
    collector:
      address: "${{APISIX_OTEL_COLLECTOR_ENDPOINT:=alloy:4318}}"
      request_timeout: 3
