# Production compose for distributed deployment.
#
# Copy this file to each server and start only the service assigned to that
# server, for example:
#
#   docker compose -f docker-compose-prod.yml up -d postgres-primary
#   docker compose -f docker-compose-prod.yml up -d postgres-replica-1
#   docker compose -f docker-compose-prod.yml up -d postgres-replica-2
#   docker compose -f docker-compose-prod.yml up -d redis
#   docker compose -f docker-compose-prod.yml up -d api
#   docker compose -f docker-compose-prod.yml up -d admin-api
#
# Frontend services are managed separately:
#
#   docker compose -f docker-compose-frontend-prod.yml up -d sso
#   docker compose -f docker-compose-frontend-prod.yml up -d admin
#
# Gateway services are managed separately:
#
#   docker compose -f docker-compose-gateway-prod.yml up -d apisix-etcd
#   docker compose -f docker-compose-gateway-prod.yml up -d apisix
#
# Cross-server services must use reachable hostnames or IP addresses through
# POSTGRES_PRIMARY_HOST, REDIS_HOST, and DATABASE_URL.
#
# Data directories use bind mounts under /data by default; override *_DATA_PATH
# with absolute paths in production when needed.

name: iam-service-prod

x-build-proxy-args: &build-proxy-args
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  NO_PROXY: ${NO_PROXY:-}
  http_proxy: ${http_proxy:-}
  https_proxy: ${https_proxy:-}
  no_proxy: ${no_proxy:-}

x-postgres-environment: &postgres-environment
  POSTGRES_USER: ${POSTGRES_USER:-iam}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB:-iam_db}
  POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
  PGDATA: /var/lib/postgresql/data
  POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-iam_replicator}
  POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:?set POSTGRES_REPLICATION_PASSWORD}
  POSTGRES_REPLICATION_CIDR: ${POSTGRES_REPLICATION_CIDR:-0.0.0.0/0}

x-postgres-common: &postgres-common
  image: ${POSTGRES_IMAGE:-docker.xuanyuan.run/postgres:18}
  restart: unless-stopped
  environment: *postgres-environment
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 30s

x-postgres-replica-common: &postgres-replica-common
  <<: *postgres-common
  entrypoint:
    - bash
    - -ec
    - |
      if [ ! -s "$${PGDATA}/PG_VERSION" ]; then
        : "$${POSTGRES_PRIMARY_HOST:?set POSTGRES_PRIMARY_HOST}"
        : "$${POSTGRES_PRIMARY_PORT:=5432}"
        : "$${POSTGRES_REPLICATION_SLOT:?set POSTGRES_REPLICATION_SLOT}"
        rm -rf "$${PGDATA:?}"/*
        install -d -m 0700 -o postgres -g postgres "$${PGDATA}"
        until pg_isready -h "$${POSTGRES_PRIMARY_HOST}" -p "$${POSTGRES_PRIMARY_PORT}" -U "$${POSTGRES_USER}"; do
          sleep 5
        done
        export PGPASSWORD="$${POSTGRES_REPLICATION_PASSWORD}"
        printf "%s\n" "SELECT pg_create_physical_replication_slot(:'slot') WHERE NOT EXISTS (SELECT 1 FROM pg_replication_slots WHERE slot_name = :'slot');" | psql \
          -h "$${POSTGRES_PRIMARY_HOST}" \
          -p "$${POSTGRES_PRIMARY_PORT}" \
          -U "$${POSTGRES_REPLICATION_USER}" \
          -d "$${POSTGRES_DB}" \
          -v ON_ERROR_STOP=1 \
          -v slot="$${POSTGRES_REPLICATION_SLOT}"
        gosu postgres pg_basebackup \
          -h "$${POSTGRES_PRIMARY_HOST}" \
          -p "$${POSTGRES_PRIMARY_PORT}" \
          -U "$${POSTGRES_REPLICATION_USER}" \
          -S "$${POSTGRES_REPLICATION_SLOT}" \
          -D "$${PGDATA}" \
          -Fp \
          -Xs \
          -P
        {
          printf "%s\n" "primary_conninfo = 'host=$${POSTGRES_PRIMARY_HOST} port=$${POSTGRES_PRIMARY_PORT} user=$${POSTGRES_REPLICATION_USER} password=$${POSTGRES_REPLICATION_PASSWORD} application_name=$${POSTGRES_REPLICATION_SLOT}'"
          printf "%s\n" "primary_slot_name = '$${POSTGRES_REPLICATION_SLOT}'"
        } > "$${PGDATA}/postgresql.auto.conf"
        touch "$${PGDATA}/standby.signal"
        chown -R postgres:postgres "$${PGDATA}"
        chmod 0700 "$${PGDATA}"
      fi
      exec docker-entrypoint.sh postgres \
        -c hot_standby=on \
        -c max_connections="$${POSTGRES_MAX_CONNECTIONS:-200}"

services:
  postgres-primary:
    <<: *postgres-common
    ports:
      - "${POSTGRES_PRIMARY_PUBLISHED_PORT:-5432}:5432"
    volumes:
      - "${POSTGRES_PRIMARY_DATA_PATH:-/data/postgres-primary}:/var/lib/postgresql/data"
    entrypoint:
      - bash
      - -ec
      - |
        repl_hba="host replication $${POSTGRES_REPLICATION_USER} $${POSTGRES_REPLICATION_CIDR} scram-sha-256"
        if [ -s "$${PGDATA}/PG_VERSION" ] && ! grep -Fqx "$${repl_hba}" "$${PGDATA}/pg_hba.conf"; then
          echo "$${repl_hba}" >> "$${PGDATA}/pg_hba.conf"
        fi
        mkdir -p /docker-entrypoint-initdb.d
        {
          printf "%s\n" "#!/usr/bin/env bash"
          printf "%s\n" "set -euo pipefail"
          printf "%s\n" "psql \\"
          printf "%s\n" "  -v ON_ERROR_STOP=1 \\"
          printf "%s\n" "  -v repl_user=\"$${POSTGRES_REPLICATION_USER}\" \\"
          printf "%s\n" "  -v repl_password=\"$${POSTGRES_REPLICATION_PASSWORD}\" \\"
          printf "%s\n" "  --username \"$${POSTGRES_USER}\" \\"
          printf "%s\n" "  --dbname \"$${POSTGRES_DB}\" <<EOSQL"
          printf "%s\n" "SELECT format('CREATE ROLE %I WITH REPLICATION LOGIN PASSWORD %L', :'repl_user', :'repl_password')"
          printf "%s\n" "WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'repl_user')\gexec"
          printf "%s\n" "SELECT format('ALTER ROLE %I WITH REPLICATION LOGIN PASSWORD %L', :'repl_user', :'repl_password')\gexec"
          printf "%s\n" "EOSQL"
          printf "%s\n" "repl_hba=\"host replication $${POSTGRES_REPLICATION_USER} $${POSTGRES_REPLICATION_CIDR} scram-sha-256\""
          printf "%s\n" "grep -Fqx \"$${repl_hba}\" \"$${PGDATA}/pg_hba.conf\" || echo \"$${repl_hba}\" >> \"$${PGDATA}/pg_hba.conf\""
        } > /docker-entrypoint-initdb.d/10-replication.sh
        chmod +x /docker-entrypoint-initdb.d/10-replication.sh
        exec docker-entrypoint.sh postgres \
          -c wal_level=replica \
          -c max_wal_senders="$${POSTGRES_MAX_WAL_SENDERS:-10}" \
          -c max_replication_slots="$${POSTGRES_MAX_REPLICATION_SLOTS:-10}" \
          -c wal_keep_size="$${POSTGRES_WAL_KEEP_SIZE:-1024MB}" \
          -c max_connections="$${POSTGRES_MAX_CONNECTIONS:-200}"

  postgres-replica-1:
    <<: *postgres-replica-common
    environment:
      <<: *postgres-environment
      POSTGRES_PRIMARY_HOST: ${POSTGRES_PRIMARY_HOST:?set POSTGRES_PRIMARY_HOST}
      POSTGRES_PRIMARY_PORT: ${POSTGRES_PRIMARY_PORT:-5432}
      POSTGRES_REPLICATION_SLOT: ${POSTGRES_REPLICA_1_SLOT:-iam_replica_1}
    ports:
      - "${POSTGRES_REPLICA_1_PUBLISHED_PORT:-5432}:5432"
    volumes:
      - "${POSTGRES_REPLICA_1_DATA_PATH:-/data/postgres-replica-1}:/var/lib/postgresql/data"

  postgres-replica-2:
    <<: *postgres-replica-common
    environment:
      <<: *postgres-environment
      POSTGRES_PRIMARY_HOST: ${POSTGRES_PRIMARY_HOST:?set POSTGRES_PRIMARY_HOST}
      POSTGRES_PRIMARY_PORT: ${POSTGRES_PRIMARY_PORT:-5432}
      POSTGRES_REPLICATION_SLOT: ${POSTGRES_REPLICA_2_SLOT:-iam_replica_2}
    ports:
      - "${POSTGRES_REPLICA_2_PUBLISHED_PORT:-5432}:5432"
    volumes:
      - "${POSTGRES_REPLICA_2_DATA_PATH:-/data/postgres-replica-2}:/var/lib/postgresql/data"

  redis:
    image: ${REDIS_IMAGE:-docker.xuanyuan.run/library/redis:latest}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    ports:
      - "${REDIS_PUBLISHED_PORT:-6379}:6379"
    volumes:
      - "${REDIS_DATA_PATH:-/data/redis}:/data"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    image: ${IAM_API_IMAGE:-iam-api:latest}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      args: *build-proxy-args
    restart: unless-stopped
    labels:
      shgas-iam.logs.enabled: "true"
      shgas-iam.logs.env: ${IAM_LOG_ENV:-prod}
      shgas-iam.logs.service: api
      shgas-iam.logs.component: backend
    ports:
      - "${API_PUBLISHED_PORT:-30000}:30000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-iam}:${POSTGRES_PASSWORD}@${POSTGRES_PRIMARY_HOST}:${POSTGRES_PRIMARY_PORT:-5432}/${POSTGRES_DB:-iam_db}}
      REDIS_URL: ${REDIS_HOST:?set REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      PORT: 30000
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      IAM_SECRET_KEY: ${IAM_SECRET_KEY:?set IAM_SECRET_KEY}
      PASSWORD_HASH_ROUNDS: ${PASSWORD_HASH_ROUNDS:-10}
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD:?set DEFAULT_USER_PASSWORD}
      MAGIC_CODE: ${MAGIC_CODE:?set MAGIC_CODE}
      CAP_ENABLED: ${CAP_ENABLED:-true}
      CAP_SITE_KEY: ${CAP_SITE_KEY:-iam-sso}
      CAP_SECRET: ${CAP_SECRET:?set CAP_SECRET}
      CAP_CHALLENGE_TTL_MS: ${CAP_CHALLENGE_TTL_MS:-600000}
      CAP_TOKEN_TTL_SECONDS: ${CAP_TOKEN_TTL_SECONDS:-600}
      HUMAN_VERIFICATION_WINDOW_SECONDS: ${HUMAN_VERIFICATION_WINDOW_SECONDS:-600}
      HUMAN_VERIFICATION_LOGIN_FAILURE_THRESHOLD: ${HUMAN_VERIFICATION_LOGIN_FAILURE_THRESHOLD:-3}
      HUMAN_VERIFICATION_LOOKUP_THRESHOLD: ${HUMAN_VERIFICATION_LOOKUP_THRESHOLD:-20}
      LOGIN_CREDENTIAL_ACTIVE_KID: ${LOGIN_CREDENTIAL_ACTIVE_KID:?set LOGIN_CREDENTIAL_ACTIVE_KID}
      LOGIN_CREDENTIAL_PRIVATE_KEYS_JSON: ${LOGIN_CREDENTIAL_PRIVATE_KEYS_JSON:?set LOGIN_CREDENTIAL_PRIVATE_KEYS_JSON}
      LOGIN_CREDENTIAL_MAX_SKEW_MS: ${LOGIN_CREDENTIAL_MAX_SKEW_MS:-300000}
      LOGIN_CREDENTIAL_NONCE_TTL_SECONDS: ${LOGIN_CREDENTIAL_NONCE_TTL_SECONDS:-360}
      WX_CORPID: ${WX_CORPID:?set WX_CORPID}
      WX_CORPSECRET: ${WX_CORPSECRET:?set WX_CORPSECRET}
      SMS_URL: ${SMS_URL:?set SMS_URL}
      SMS_SIGNATURE_KEY: ${SMS_SIGNATURE_KEY:?set SMS_SIGNATURE_KEY}
      ORCAS_URL: ${ORCAS_URL:?set ORCAS_URL}
      PURVEYOR_PARENT_ORG: ${PURVEYOR_PARENT_ORG:-GY}
      REDIS_EXPIRE_TIME: ${REDIS_EXPIRE_TIME:-86400}
      AUTH_CODE_EXPIRE_TIME: ${AUTH_CODE_EXPIRE_TIME:-300}
      LOGIN_ENDPOINT: ${LOGIN_ENDPOINT:-/portal/login}
      SSO_INTERNAL_ORIGIN: ${SSO_INTERNAL_ORIGIN:?set SSO_INTERNAL_ORIGIN}
      SSO_EXTERNAL_ORIGIN: ${SSO_EXTERNAL_ORIGIN:?set SSO_EXTERNAL_ORIGIN}
      AUTHORIZATION_ENDPOINT: ${AUTHORIZATION_ENDPOINT:-/sso/authorize}
      LOGOUT_ENDPOINT: ${LOGOUT_ENDPOINT:-/sso/logout}
      THIRDPARTY_OA_ENDPOINT: ${THIRDPARTY_OA_ENDPOINT:-/sso/thirdparty/oa}
      HTTP_PROXY: http://176.169.105.96:3928
      HTTPS_PROXY: http://176.169.105.96:3928
      NO_PROXY: localhost,127.0.0.1,176.169.99.191,176.169.99.95,180.50.65.131,192.168.0.0/16,176.169.99.125,176.169.86.35

  admin-api:
    image: ${IAM_ADMIN_API_IMAGE:-iam-admin-api:latest}
    build:
      context: ..
      dockerfile: apps/admin-api/Dockerfile
      args: *build-proxy-args
    restart: unless-stopped
    labels:
      shgas-iam.logs.enabled: "true"
      shgas-iam.logs.env: ${IAM_LOG_ENV:-prod}
      shgas-iam.logs.service: admin-api
      shgas-iam.logs.component: backend
    ports:
      - "${ADMIN_API_PUBLISHED_PORT:-30001}:30001"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-iam}:${POSTGRES_PASSWORD}@${POSTGRES_PRIMARY_HOST}:${POSTGRES_PRIMARY_PORT:-5432}/${POSTGRES_DB:-iam_db}}
      REDIS_URL: ${REDIS_HOST:?set REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      PORT: 30001
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PASSWORD_HASH_ROUNDS: ${PASSWORD_HASH_ROUNDS:-10}
      ADMIN_CLIENT_CODES: ${ADMIN_CLIENT_CODES:-iam}
      ADMIN_ROLE_CODES: ${ADMIN_ROLE_CODES:-iam:admin}

  oidc-provider:
    image: ${IAM_OIDC_PROVIDER_IMAGE:-iam-oidc-provider:latest}
    build:
      context: ..
      dockerfile: apps/oidc-provider/Dockerfile
      args: *build-proxy-args
    restart: unless-stopped
    labels:
      shgas-iam.logs.enabled: "true"
      shgas-iam.logs.env: ${IAM_LOG_ENV:-prod}
      shgas-iam.logs.service: oidc-provider
      shgas-iam.logs.component: backend
    ports:
      - "${OIDC_PROVIDER_PUBLISHED_PORT:-30002}:30002"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-iam}:${POSTGRES_PASSWORD}@${POSTGRES_PRIMARY_HOST}:${POSTGRES_PRIMARY_PORT:-5432}/${POSTGRES_DB:-iam_db}}
      REDIS_URL: ${REDIS_HOST:?set REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      PORT: 30002
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OIDC_ISSUER: ${OIDC_ISSUER:?set OIDC_ISSUER}
      OIDC_PUBLIC_ORIGIN: ${OIDC_PUBLIC_ORIGIN:?set OIDC_PUBLIC_ORIGIN}
      OIDC_SSO_LOGIN_PATH: ${OIDC_SSO_LOGIN_PATH:-/portal/login}
      OIDC_COOKIE_KEYS: ${OIDC_COOKIE_KEYS:?set OIDC_COOKIE_KEYS}
      OIDC_CURRENT_JWK_JSON: ${OIDC_CURRENT_JWK_JSON:?set OIDC_CURRENT_JWK_JSON}
      OIDC_PREVIOUS_JWK_JSON: ${OIDC_PREVIOUS_JWK_JSON:-}
      OIDC_GLOBAL_SESSION_COOKIE: ${OIDC_GLOBAL_SESSION_COOKIE:-global_session}
      OIDC_GLOBAL_SESSION_TTL_SECONDS: ${OIDC_GLOBAL_SESSION_TTL_SECONDS:-86400}
      OIDC_AUTHORIZATION_CODE_TTL_SECONDS: ${OIDC_AUTHORIZATION_CODE_TTL_SECONDS:-300}
      OIDC_INTERACTION_TTL_SECONDS: ${OIDC_INTERACTION_TTL_SECONDS:-600}
      OIDC_ACCESS_TOKEN_TTL_SECONDS: ${OIDC_ACCESS_TOKEN_TTL_SECONDS:-3600}
      OIDC_ID_TOKEN_TTL_SECONDS: ${OIDC_ID_TOKEN_TTL_SECONDS:-3600}
      OIDC_CLIENT_CACHE_TTL_SECONDS: ${OIDC_CLIENT_CACHE_TTL_SECONDS:-60}
      OIDC_BCRYPT_COST: ${OIDC_BCRYPT_COST:-12}
      OIDC_CLIENT_AUTH_FAILURE_LIMIT: ${OIDC_CLIENT_AUTH_FAILURE_LIMIT:-5}
      OIDC_CLIENT_AUTH_FAILURE_WINDOW_SECONDS: ${OIDC_CLIENT_AUTH_FAILURE_WINDOW_SECONDS:-60}
      OIDC_TRUST_PROXY: ${OIDC_TRUST_PROXY:-true}
