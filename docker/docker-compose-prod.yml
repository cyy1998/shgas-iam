# Production compose for distributed deployment.
#
# Copy this file to each server and start only the service assigned to that
# server, for example:
#
#   docker compose -f docker-compose-prod.yml up -d postgres-primary
#   docker compose -f docker-compose-prod.yml up -d postgres-replica-1
#   docker compose -f docker-compose-prod.yml up -d postgres-replica-2
#   docker compose -f docker-compose-prod.yml up -d redis
#   docker compose -f docker-compose-prod.yml up -d api
#   docker compose -f docker-compose-prod.yml up -d admin-api
#
# Frontend services are managed separately:
#
#   docker compose -f docker-compose-frontend-prod.yml up -d sso
#   docker compose -f docker-compose-frontend-prod.yml up -d admin
#
# Gateway services are managed separately:
#
#   docker compose -f docker-compose-gateway-prod.yml up -d apisix-etcd
#   docker compose -f docker-compose-gateway-prod.yml up -d apisix
#
# Cross-server services must use reachable hostnames or IP addresses through
# POSTGRES_PRIMARY_HOST, IAM_REDIS_HOST, and IAM_<APP>_DATABASE_URL.
#
# Data directories use bind mounts under /data by default; override *_DATA_PATH
# with absolute paths in production when needed.

name: iam-service-prod

x-build-proxy-args: &build-proxy-args
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  NO_PROXY: ${NO_PROXY:-}
  http_proxy: ${http_proxy:-}
  https_proxy: ${https_proxy:-}
  no_proxy: ${no_proxy:-}

x-postgres-environment: &postgres-environment
  POSTGRES_USER: ${POSTGRES_USER:-iam}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB:-iam_db}
  POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
  PGDATA: /var/lib/postgresql/data
  POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-iam_replicator}
  POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:?set POSTGRES_REPLICATION_PASSWORD}
  POSTGRES_REPLICATION_CIDR: ${POSTGRES_REPLICATION_CIDR:-0.0.0.0/0}

x-postgres-common: &postgres-common
  image: ${POSTGRES_IMAGE:-docker.xuanyuan.run/postgres:18}
  restart: unless-stopped
  environment: *postgres-environment
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 30s

x-postgres-replica-common: &postgres-replica-common
  <<: *postgres-common
  entrypoint:
    - bash
    - -ec
    - |
      if [ ! -s "$${PGDATA}/PG_VERSION" ]; then
        : "$${POSTGRES_PRIMARY_HOST:?set POSTGRES_PRIMARY_HOST}"
        : "$${POSTGRES_PRIMARY_PORT:=5432}"
        : "$${POSTGRES_REPLICATION_SLOT:?set POSTGRES_REPLICATION_SLOT}"
        rm -rf "$${PGDATA:?}"/*
        install -d -m 0700 -o postgres -g postgres "$${PGDATA}"
        until pg_isready -h "$${POSTGRES_PRIMARY_HOST}" -p "$${POSTGRES_PRIMARY_PORT}" -U "$${POSTGRES_USER}"; do
          sleep 5
        done
        export PGPASSWORD="$${POSTGRES_REPLICATION_PASSWORD}"
        printf "%s\n" "SELECT pg_create_physical_replication_slot(:'slot') WHERE NOT EXISTS (SELECT 1 FROM pg_replication_slots WHERE slot_name = :'slot');" | psql \
          -h "$${POSTGRES_PRIMARY_HOST}" \
          -p "$${POSTGRES_PRIMARY_PORT}" \
          -U "$${POSTGRES_REPLICATION_USER}" \
          -d "$${POSTGRES_DB}" \
          -v ON_ERROR_STOP=1 \
          -v slot="$${POSTGRES_REPLICATION_SLOT}"
        gosu postgres pg_basebackup \
          -h "$${POSTGRES_PRIMARY_HOST}" \
          -p "$${POSTGRES_PRIMARY_PORT}" \
          -U "$${POSTGRES_REPLICATION_USER}" \
          -S "$${POSTGRES_REPLICATION_SLOT}" \
          -D "$${PGDATA}" \
          -Fp \
          -Xs \
          -P
        {
          printf "%s\n" "primary_conninfo = 'host=$${POSTGRES_PRIMARY_HOST} port=$${POSTGRES_PRIMARY_PORT} user=$${POSTGRES_REPLICATION_USER} password=$${POSTGRES_REPLICATION_PASSWORD} application_name=$${POSTGRES_REPLICATION_SLOT}'"
          printf "%s\n" "primary_slot_name = '$${POSTGRES_REPLICATION_SLOT}'"
        } > "$${PGDATA}/postgresql.auto.conf"
        touch "$${PGDATA}/standby.signal"
        chown -R postgres:postgres "$${PGDATA}"
        chmod 0700 "$${PGDATA}"
      fi
      exec docker-entrypoint.sh postgres \
        -c hot_standby=on \
        -c max_connections="$${POSTGRES_MAX_CONNECTIONS:-200}"

services:
  postgres-primary:
    <<: *postgres-common
    ports:
      - "${POSTGRES_PRIMARY_PUBLISHED_PORT:-5432}:5432"
    volumes:
      - "${POSTGRES_PRIMARY_DATA_PATH:-/data/postgres-primary}:/var/lib/postgresql/data"
    entrypoint:
      - bash
      - -ec
      - |
        repl_hba="host replication $${POSTGRES_REPLICATION_USER} $${POSTGRES_REPLICATION_CIDR} scram-sha-256"
        if [ -s "$${PGDATA}/PG_VERSION" ] && ! grep -Fqx "$${repl_hba}" "$${PGDATA}/pg_hba.conf"; then
          echo "$${repl_hba}" >> "$${PGDATA}/pg_hba.conf"
        fi
        mkdir -p /docker-entrypoint-initdb.d
        {
          printf "%s\n" "#!/usr/bin/env bash"
          printf "%s\n" "set -euo pipefail"
          printf "%s\n" "psql \\"
          printf "%s\n" "  -v ON_ERROR_STOP=1 \\"
          printf "%s\n" "  -v repl_user=\"$${POSTGRES_REPLICATION_USER}\" \\"
          printf "%s\n" "  -v repl_password=\"$${POSTGRES_REPLICATION_PASSWORD}\" \\"
          printf "%s\n" "  --username \"$${POSTGRES_USER}\" \\"
          printf "%s\n" "  --dbname \"$${POSTGRES_DB}\" <<EOSQL"
          printf "%s\n" "SELECT format('CREATE ROLE %I WITH REPLICATION LOGIN PASSWORD %L', :'repl_user', :'repl_password')"
          printf "%s\n" "WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'repl_user')\gexec"
          printf "%s\n" "SELECT format('ALTER ROLE %I WITH REPLICATION LOGIN PASSWORD %L', :'repl_user', :'repl_password')\gexec"
          printf "%s\n" "EOSQL"
          printf "%s\n" "repl_hba=\"host replication $${POSTGRES_REPLICATION_USER} $${POSTGRES_REPLICATION_CIDR} scram-sha-256\""
          printf "%s\n" "grep -Fqx \"$${repl_hba}\" \"$${PGDATA}/pg_hba.conf\" || echo \"$${repl_hba}\" >> \"$${PGDATA}/pg_hba.conf\""
        } > /docker-entrypoint-initdb.d/10-replication.sh
        chmod +x /docker-entrypoint-initdb.d/10-replication.sh
        exec docker-entrypoint.sh postgres \
          -c wal_level=replica \
          -c max_wal_senders="$${POSTGRES_MAX_WAL_SENDERS:-10}" \
          -c max_replication_slots="$${POSTGRES_MAX_REPLICATION_SLOTS:-10}" \
          -c wal_keep_size="$${POSTGRES_WAL_KEEP_SIZE:-1024MB}" \
          -c max_connections="$${POSTGRES_MAX_CONNECTIONS:-200}"

  postgres-replica-1:
    <<: *postgres-replica-common
    environment:
      <<: *postgres-environment
      POSTGRES_PRIMARY_HOST: ${POSTGRES_PRIMARY_HOST:?set POSTGRES_PRIMARY_HOST}
      POSTGRES_PRIMARY_PORT: ${POSTGRES_PRIMARY_PORT:-5432}
      POSTGRES_REPLICATION_SLOT: ${POSTGRES_REPLICA_1_SLOT:-iam_replica_1}
    ports:
      - "${POSTGRES_REPLICA_1_PUBLISHED_PORT:-5432}:5432"
    volumes:
      - "${POSTGRES_REPLICA_1_DATA_PATH:-/data/postgres-replica-1}:/var/lib/postgresql/data"

  postgres-replica-2:
    <<: *postgres-replica-common
    environment:
      <<: *postgres-environment
      POSTGRES_PRIMARY_HOST: ${POSTGRES_PRIMARY_HOST:?set POSTGRES_PRIMARY_HOST}
      POSTGRES_PRIMARY_PORT: ${POSTGRES_PRIMARY_PORT:-5432}
      POSTGRES_REPLICATION_SLOT: ${POSTGRES_REPLICA_2_SLOT:-iam_replica_2}
    ports:
      - "${POSTGRES_REPLICA_2_PUBLISHED_PORT:-5432}:5432"
    volumes:
      - "${POSTGRES_REPLICA_2_DATA_PATH:-/data/postgres-replica-2}:/var/lib/postgresql/data"

  redis:
    image: ${REDIS_IMAGE:-docker.xuanyuan.run/library/redis:latest}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    ports:
      - "${REDIS_PUBLISHED_PORT:-6379}:6379"
    volumes:
      - "${REDIS_DATA_PATH:-/data/redis}:/data"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    image: ${IAM_API_IMAGE:-iam-api:latest}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      args: *build-proxy-args
    restart: unless-stopped
    labels:
      shgas-iam.logs.enabled: "true"
      shgas-iam.logs.env: ${IAM_LOG_ENV:-prod}
      shgas-iam.logs.service: api
      shgas-iam.logs.component: backend
    ports:
      - "${IAM_API_PUBLISHED_PORT:-30000}:30000"
    environment:
      IAM_API_DATABASE_URL: ${IAM_API_DATABASE_URL:-postgresql://${POSTGRES_USER:-iam}:${POSTGRES_PASSWORD}@${POSTGRES_PRIMARY_HOST}:${POSTGRES_PRIMARY_PORT:-5432}/${POSTGRES_DB:-iam_db}}
      IAM_API_REDIS_HOST: ${IAM_REDIS_HOST:?set IAM_REDIS_HOST}
      IAM_API_REDIS_PORT: ${IAM_REDIS_PORT:-6379}
      IAM_API_REDIS_PASSWORD: ${IAM_REDIS_PASSWORD:?set IAM_REDIS_PASSWORD}
      IAM_API_REDIS_DB: ${IAM_REDIS_DB:-0}
      IAM_API_PORT: 30000
      NODE_ENV: production
      IAM_API_LOG_LEVEL: ${IAM_LOG_LEVEL:-info}
      IAM_API_LOG_FORMAT: ${IAM_LOG_FORMAT:-json}
      IAM_API_PASSWORD_HASH_ROUNDS: ${IAM_API_PASSWORD_HASH_ROUNDS:-10}
      IAM_API_MAGIC_CODE: ${IAM_API_MAGIC_CODE:?set IAM_API_MAGIC_CODE}
      IAM_API_CAP_ENABLED: ${IAM_API_CAP_ENABLED:-true}
      IAM_API_CAP_SITE_KEY: ${IAM_API_CAP_SITE_KEY:-iam-sso}
      IAM_API_CAP_SECRET: ${IAM_API_CAP_SECRET:?set IAM_API_CAP_SECRET}
      IAM_API_CAP_CHALLENGE_TTL_MS: ${IAM_API_CAP_CHALLENGE_TTL_MS:-600000}
      IAM_API_CAP_TOKEN_TTL_SECONDS: ${IAM_API_CAP_TOKEN_TTL_SECONDS:-600}
      IAM_API_HUMAN_VERIFICATION_WINDOW_SECONDS: ${IAM_API_HUMAN_VERIFICATION_WINDOW_SECONDS:-600}
      IAM_API_HUMAN_VERIFICATION_LOGIN_FAILURE_THRESHOLD: ${IAM_API_HUMAN_VERIFICATION_LOGIN_FAILURE_THRESHOLD:-3}
      IAM_API_HUMAN_VERIFICATION_LOOKUP_THRESHOLD: ${IAM_API_HUMAN_VERIFICATION_LOOKUP_THRESHOLD:-20}
      IAM_API_LOGIN_CREDENTIAL_ACTIVE_KID: ${IAM_API_LOGIN_CREDENTIAL_ACTIVE_KID:?set IAM_API_LOGIN_CREDENTIAL_ACTIVE_KID}
      IAM_API_LOGIN_CREDENTIAL_PRIVATE_KEYS_JSON: ${IAM_API_LOGIN_CREDENTIAL_PRIVATE_KEYS_JSON:?set IAM_API_LOGIN_CREDENTIAL_PRIVATE_KEYS_JSON}
      IAM_API_LOGIN_CREDENTIAL_MAX_SKEW_MS: ${IAM_API_LOGIN_CREDENTIAL_MAX_SKEW_MS:-300000}
      IAM_API_LOGIN_CREDENTIAL_NONCE_TTL_SECONDS: ${IAM_API_LOGIN_CREDENTIAL_NONCE_TTL_SECONDS:-360}
      IAM_API_SESSION_KERNEL_NAMESPACE: ${IAM_SESSION_KERNEL_NAMESPACE:-sess:v2:}
      IAM_API_SESSION_KERNEL_PRINCIPAL_IDLE_TTL_SECONDS: ${IAM_SESSION_KERNEL_PRINCIPAL_IDLE_TTL_SECONDS:-86400}
      IAM_API_SESSION_KERNEL_PRINCIPAL_ABSOLUTE_TTL_SECONDS: ${IAM_SESSION_KERNEL_PRINCIPAL_ABSOLUTE_TTL_SECONDS:-86400}
      IAM_API_SESSION_KERNEL_TOMBSTONE_TTL_SECONDS: ${IAM_SESSION_KERNEL_TOMBSTONE_TTL_SECONDS:-86400}
      IAM_API_SESSION_KERNEL_TOMBSTONE_GRACE_SECONDS: ${IAM_SESSION_KERNEL_TOMBSTONE_GRACE_SECONDS:-300}
      IAM_API_SESSION_LOOKUP_HMAC_CURRENT_ID: ${IAM_SESSION_LOOKUP_HMAC_CURRENT_ID:?set IAM_SESSION_LOOKUP_HMAC_CURRENT_ID}
      IAM_API_SESSION_LOOKUP_HMAC_CURRENT_SECRET: ${IAM_SESSION_LOOKUP_HMAC_CURRENT_SECRET:?set IAM_SESSION_LOOKUP_HMAC_CURRENT_SECRET}
      IAM_API_SESSION_LOOKUP_HMAC_PREVIOUS_ID: ${IAM_SESSION_LOOKUP_HMAC_PREVIOUS_ID:-}
      IAM_API_SESSION_LOOKUP_HMAC_PREVIOUS_SECRET: ${IAM_SESSION_LOOKUP_HMAC_PREVIOUS_SECRET:-}
      IAM_API_WECHAT_CORP_ID: ${IAM_API_WECHAT_CORP_ID:?set IAM_API_WECHAT_CORP_ID}
      IAM_API_WECHAT_CORP_SECRET: ${IAM_API_WECHAT_CORP_SECRET:?set IAM_API_WECHAT_CORP_SECRET}
      IAM_API_SMS_URL: ${IAM_API_SMS_URL:?set IAM_API_SMS_URL}
      IAM_API_SMS_SIGNATURE_KEY: ${IAM_API_SMS_SIGNATURE_KEY:?set IAM_API_SMS_SIGNATURE_KEY}
      IAM_API_ORCAS_URL: ${IAM_API_ORCAS_URL:?set IAM_API_ORCAS_URL}
      IAM_API_SESSION_DEFAULT_TTL_SECONDS: ${IAM_API_SESSION_DEFAULT_TTL_SECONDS:-86400}
      IAM_API_AUTH_CODE_TTL_SECONDS: ${IAM_API_AUTH_CODE_TTL_SECONDS:-300}
      IAM_API_LOGIN_ENDPOINT: ${IAM_API_LOGIN_ENDPOINT:-/portal/login}
      IAM_API_SSO_INTERNAL_ORIGIN: ${IAM_API_SSO_INTERNAL_ORIGIN:?set IAM_API_SSO_INTERNAL_ORIGIN}
      IAM_API_SSO_EXTERNAL_ORIGIN: ${IAM_API_SSO_EXTERNAL_ORIGIN:?set IAM_API_SSO_EXTERNAL_ORIGIN}
      IAM_API_AUTHORIZATION_ENDPOINT: ${IAM_API_AUTHORIZATION_ENDPOINT:-/sso/authorize}
      IAM_API_LOGOUT_ENDPOINT: ${IAM_API_LOGOUT_ENDPOINT:-/sso/logout}
      IAM_API_THIRDPARTY_OA_ENDPOINT: ${IAM_API_THIRDPARTY_OA_ENDPOINT:-/sso/thirdparty/oa}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres-primary,redis,apisix,apisix-etcd}

  admin-api:
    image: ${IAM_ADMIN_API_IMAGE:-iam-admin-api:latest}
    build:
      context: ..
      dockerfile: apps/admin-api/Dockerfile
      args: *build-proxy-args
    restart: unless-stopped
    labels:
      shgas-iam.logs.enabled: "true"
      shgas-iam.logs.env: ${IAM_LOG_ENV:-prod}
      shgas-iam.logs.service: admin-api
      shgas-iam.logs.component: backend
    ports:
      - "${IAM_ADMIN_API_PUBLISHED_PORT:-30001}:30001"
    environment:
      IAM_ADMIN_API_DATABASE_URL: ${IAM_ADMIN_API_DATABASE_URL:-postgresql://${POSTGRES_USER:-iam}:${POSTGRES_PASSWORD}@${POSTGRES_PRIMARY_HOST}:${POSTGRES_PRIMARY_PORT:-5432}/${POSTGRES_DB:-iam_db}}
      IAM_ADMIN_API_REDIS_HOST: ${IAM_REDIS_HOST:?set IAM_REDIS_HOST}
      IAM_ADMIN_API_REDIS_PORT: ${IAM_REDIS_PORT:-6379}
      IAM_ADMIN_API_REDIS_PASSWORD: ${IAM_REDIS_PASSWORD:?set IAM_REDIS_PASSWORD}
      IAM_ADMIN_API_REDIS_DB: ${IAM_REDIS_DB:-0}
      IAM_ADMIN_API_PORT: 30001
      NODE_ENV: production
      IAM_ADMIN_API_LOG_LEVEL: ${IAM_LOG_LEVEL:-info}
      IAM_ADMIN_API_LOG_FORMAT: ${IAM_LOG_FORMAT:-json}
      IAM_ADMIN_API_PASSWORD_HASH_ROUNDS: ${IAM_ADMIN_API_PASSWORD_HASH_ROUNDS:-10}
      IAM_ADMIN_API_ADMIN_CLIENT_CODES: ${IAM_ADMIN_API_ADMIN_CLIENT_CODES:-iam-admin}
      IAM_ADMIN_API_ADMIN_ROLE_CODES: ${IAM_ADMIN_API_ADMIN_ROLE_CODES:-iam:admin}
      IAM_ADMIN_API_SESSION_KERNEL_NAMESPACE: ${IAM_SESSION_KERNEL_NAMESPACE:-sess:v2:}
      IAM_ADMIN_API_SESSION_KERNEL_PRINCIPAL_IDLE_TTL_SECONDS: ${IAM_SESSION_KERNEL_PRINCIPAL_IDLE_TTL_SECONDS:-86400}
      IAM_ADMIN_API_SESSION_KERNEL_PRINCIPAL_ABSOLUTE_TTL_SECONDS: ${IAM_SESSION_KERNEL_PRINCIPAL_ABSOLUTE_TTL_SECONDS:-86400}
      IAM_ADMIN_API_SESSION_KERNEL_TOMBSTONE_TTL_SECONDS: ${IAM_SESSION_KERNEL_TOMBSTONE_TTL_SECONDS:-86400}
      IAM_ADMIN_API_SESSION_KERNEL_TOMBSTONE_GRACE_SECONDS: ${IAM_SESSION_KERNEL_TOMBSTONE_GRACE_SECONDS:-300}
      IAM_ADMIN_API_SESSION_LOOKUP_HMAC_CURRENT_ID: ${IAM_SESSION_LOOKUP_HMAC_CURRENT_ID:?set IAM_SESSION_LOOKUP_HMAC_CURRENT_ID}
      IAM_ADMIN_API_SESSION_LOOKUP_HMAC_CURRENT_SECRET: ${IAM_SESSION_LOOKUP_HMAC_CURRENT_SECRET:?set IAM_SESSION_LOOKUP_HMAC_CURRENT_SECRET}
      IAM_ADMIN_API_SESSION_LOOKUP_HMAC_PREVIOUS_ID: ${IAM_SESSION_LOOKUP_HMAC_PREVIOUS_ID:-}
      IAM_ADMIN_API_SESSION_LOOKUP_HMAC_PREVIOUS_SECRET: ${IAM_SESSION_LOOKUP_HMAC_PREVIOUS_SECRET:-}

  oidc-provider:
    image: ${IAM_OIDC_PROVIDER_IMAGE:-iam-oidc-provider:latest}
    build:
      context: ..
      dockerfile: apps/oidc-provider/Dockerfile
      args: *build-proxy-args
    restart: unless-stopped
    labels:
      shgas-iam.logs.enabled: "true"
      shgas-iam.logs.env: ${IAM_LOG_ENV:-prod}
      shgas-iam.logs.service: oidc-provider
      shgas-iam.logs.component: backend
    ports:
      - "${IAM_OIDC_PROVIDER_PUBLISHED_PORT:-30002}:30002"
    environment:
      IAM_OIDC_PROVIDER_DATABASE_URL: ${IAM_OIDC_PROVIDER_DATABASE_URL:-postgresql://${POSTGRES_USER:-iam}:${POSTGRES_PASSWORD}@${POSTGRES_PRIMARY_HOST}:${POSTGRES_PRIMARY_PORT:-5432}/${POSTGRES_DB:-iam_db}}
      IAM_OIDC_PROVIDER_REDIS_HOST: ${IAM_REDIS_HOST:?set IAM_REDIS_HOST}
      IAM_OIDC_PROVIDER_REDIS_PORT: ${IAM_REDIS_PORT:-6379}
      IAM_OIDC_PROVIDER_REDIS_PASSWORD: ${IAM_REDIS_PASSWORD:?set IAM_REDIS_PASSWORD}
      IAM_OIDC_PROVIDER_REDIS_DB: ${IAM_REDIS_DB:-0}
      IAM_OIDC_PROVIDER_PORT: 30002
      NODE_ENV: production
      IAM_OIDC_PROVIDER_LOG_LEVEL: ${IAM_LOG_LEVEL:-info}
      IAM_OIDC_PROVIDER_LOG_FORMAT: ${IAM_LOG_FORMAT:-json}
      IAM_OIDC_PROVIDER_ISSUER: ${IAM_OIDC_PROVIDER_ISSUER:?set IAM_OIDC_PROVIDER_ISSUER}
      IAM_OIDC_PROVIDER_PUBLIC_ORIGIN: ${IAM_OIDC_PROVIDER_PUBLIC_ORIGIN:?set IAM_OIDC_PROVIDER_PUBLIC_ORIGIN}
      IAM_OIDC_PROVIDER_SSO_LOGIN_PATH: ${IAM_OIDC_PROVIDER_SSO_LOGIN_PATH:-/portal/login}
      IAM_OIDC_PROVIDER_COOKIE_KEYS: ${IAM_OIDC_PROVIDER_COOKIE_KEYS:?set IAM_OIDC_PROVIDER_COOKIE_KEYS}
      IAM_OIDC_PROVIDER_CURRENT_JWK_JSON: ${IAM_OIDC_PROVIDER_CURRENT_JWK_JSON:?set IAM_OIDC_PROVIDER_CURRENT_JWK_JSON}
      IAM_OIDC_PROVIDER_PREVIOUS_JWK_JSON: ${IAM_OIDC_PROVIDER_PREVIOUS_JWK_JSON:-}
      IAM_OIDC_PROVIDER_GLOBAL_SESSION_COOKIE: ${IAM_OIDC_PROVIDER_GLOBAL_SESSION_COOKIE:-global_session}
      IAM_OIDC_PROVIDER_GLOBAL_SESSION_TTL_SECONDS: ${IAM_OIDC_PROVIDER_GLOBAL_SESSION_TTL_SECONDS:-86400}
      IAM_OIDC_PROVIDER_AUTHORIZATION_CODE_TTL_SECONDS: ${IAM_OIDC_PROVIDER_AUTHORIZATION_CODE_TTL_SECONDS:-300}
      IAM_OIDC_PROVIDER_INTERACTION_TTL_SECONDS: ${IAM_OIDC_PROVIDER_INTERACTION_TTL_SECONDS:-600}
      IAM_OIDC_PROVIDER_ACCESS_TOKEN_TTL_SECONDS: ${IAM_OIDC_PROVIDER_ACCESS_TOKEN_TTL_SECONDS:-3600}
      IAM_OIDC_PROVIDER_ID_TOKEN_TTL_SECONDS: ${IAM_OIDC_PROVIDER_ID_TOKEN_TTL_SECONDS:-3600}
      IAM_OIDC_PROVIDER_CLIENT_CACHE_TTL_SECONDS: ${IAM_OIDC_PROVIDER_CLIENT_CACHE_TTL_SECONDS:-60}
      IAM_OIDC_PROVIDER_BCRYPT_COST: ${IAM_OIDC_PROVIDER_BCRYPT_COST:-12}
      IAM_OIDC_PROVIDER_CLIENT_AUTH_FAILURE_LIMIT: ${IAM_OIDC_PROVIDER_CLIENT_AUTH_FAILURE_LIMIT:-5}
      IAM_OIDC_PROVIDER_CLIENT_AUTH_FAILURE_WINDOW_SECONDS: ${IAM_OIDC_PROVIDER_CLIENT_AUTH_FAILURE_WINDOW_SECONDS:-60}
      IAM_OIDC_PROVIDER_TRUST_PROXY: ${IAM_OIDC_PROVIDER_TRUST_PROXY:-true}
      IAM_OIDC_PROVIDER_SESSION_KERNEL_NAMESPACE: ${IAM_SESSION_KERNEL_NAMESPACE:-sess:v2:}
      IAM_OIDC_PROVIDER_SESSION_KERNEL_PRINCIPAL_IDLE_TTL_SECONDS: ${IAM_SESSION_KERNEL_PRINCIPAL_IDLE_TTL_SECONDS:-86400}
      IAM_OIDC_PROVIDER_SESSION_KERNEL_PRINCIPAL_ABSOLUTE_TTL_SECONDS: ${IAM_SESSION_KERNEL_PRINCIPAL_ABSOLUTE_TTL_SECONDS:-86400}
      IAM_OIDC_PROVIDER_SESSION_KERNEL_TOMBSTONE_TTL_SECONDS: ${IAM_SESSION_KERNEL_TOMBSTONE_TTL_SECONDS:-86400}
      IAM_OIDC_PROVIDER_SESSION_KERNEL_TOMBSTONE_GRACE_SECONDS: ${IAM_SESSION_KERNEL_TOMBSTONE_GRACE_SECONDS:-300}
      IAM_OIDC_PROVIDER_SESSION_LOOKUP_HMAC_CURRENT_ID: ${IAM_SESSION_LOOKUP_HMAC_CURRENT_ID:?set IAM_SESSION_LOOKUP_HMAC_CURRENT_ID}
      IAM_OIDC_PROVIDER_SESSION_LOOKUP_HMAC_CURRENT_SECRET: ${IAM_SESSION_LOOKUP_HMAC_CURRENT_SECRET:?set IAM_SESSION_LOOKUP_HMAC_CURRENT_SECRET}
      IAM_OIDC_PROVIDER_SESSION_LOOKUP_HMAC_PREVIOUS_ID: ${IAM_SESSION_LOOKUP_HMAC_PREVIOUS_ID:-}
      IAM_OIDC_PROVIDER_SESSION_LOOKUP_HMAC_PREVIOUS_SECRET: ${IAM_SESSION_LOOKUP_HMAC_PREVIOUS_SECRET:-}
