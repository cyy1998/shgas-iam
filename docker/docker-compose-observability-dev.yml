name: iam-service-dev-observability

services:
  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.5.1}
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki.yaml
      - -config.expand-env=true
    ports:
      - "${LOKI_HTTP_PUBLISHED_PORT:-3100}:3100"
    volumes:
      - ../observability/loki/loki.dev.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana-oss:12.0.2}
    restart: unless-stopped
    ports:
      - "${GRAFANA_HTTP_PUBLISHED_PORT:-30030}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_AUTH_ANONYMOUS_ENABLED:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: ${GRAFANA_AUTH_ANONYMOUS_ORG_ROLE:-Admin}
      GRAFANA_LOKI_URL: ${GRAFANA_LOKI_URL:-http://loki:3100}
      GRAFANA_DEV_ALERT_WEBHOOK_URL: ${GRAFANA_DEV_ALERT_WEBHOOK_URL:-http://127.0.0.1:9/iam-dev-null}
    volumes:
      - grafana_data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki

  alloy:
    image: ${GRAFANA_ALLOY_IMAGE:-grafana/alloy:v1.9.2}
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/iam-logs.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    ports:
      - "${ALLOY_HTTP_PUBLISHED_PORT:-12345}:12345"
    environment:
      ALLOY_LOG_LEVEL: ${ALLOY_LOG_LEVEL:-info}
      IAM_LOG_HOST: ${IAM_LOG_HOST:-dev-docker}
      LOKI_PUSH_URL: ${LOKI_PUSH_URL:-http://loki:3100/loki/api/v1/push}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
      - ../observability/alloy/iam-logs.dev.alloy:/etc/alloy/iam-logs.alloy:ro
    depends_on:
      - loki

volumes:
  loki_data:
  grafana_data:
  alloy_data:
