services:
  db:
    image: ${POSTGRES_IMAGE:-docker.xuanyuan.run/postgres:18.4}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iam_password}
      POSTGRES_DB: ${POSTGRES_DB:-iam_db}
    ports:
      - "${POSTGRES_PUBLISHED_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iam} -d ${POSTGRES_DB:-iam_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${REDIS_IMAGE:-docker.xuanyuan.run/library/redis:8.8.0}
    restart: unless-stopped
    ports:
      - "${REDIS_PUBLISHED_PORT:-6390}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  apisix-etcd:
    image: ${APISIX_ETCD_IMAGE:-docker.xuanyuan.run/bitnamilegacy/etcd:3.5.11}
    restart: unless-stopped
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: http://apisix-etcd:2379
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
    volumes:
      - apisix_etcd_data:/bitnami/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://127.0.0.1:2379"]
      interval: 10s
      timeout: 5s
      retries: 5

  apisix:
    image: ${APISIX_IMAGE:-docker.xuanyuan.run/apache/apisix:3.16.0-debian}
    restart: unless-stopped
    labels:
      shgas-iam.logs.enabled: "true"
      shgas-iam.logs.env: dev
      shgas-iam.logs.service: apisix
      shgas-iam.logs.component: gateway
    ports:
      - "${APISIX_HTTP_PUBLISHED_PORT:-30080}:9080"
      - "${APISIX_HTTPS_PUBLISHED_PORT:-30443}:9443"
      - "${APISIX_ADMIN_PUBLISHED_PORT:-9180}:9180"
    environment:
      APISIX_OTEL_COLLECTOR_ENDPOINT: ${APISIX_OTEL_COLLECTOR_ENDPOINT:-alloy:4318}
    volumes:
      - ../gateway/config/config.dev.yaml:/usr/local/apisix/conf/config.yaml:ro
    depends_on:
      apisix-etcd:
        condition: service_healthy

  sso:
    build:
      context: ..
      dockerfile: apps/sso/Dockerfile
      args:
        <<: *build-proxy-args
        UMI_APP_SSO_API_PREFIX: ${UMI_APP_SSO_API_PREFIX:-/api/iam}
        UMI_APP_SSO_CLIENT_CODE: ${UMI_APP_SSO_CLIENT_CODE:-iam}
        UMI_APP_SSO_CAP_SITE_KEY: ${UMI_APP_SSO_CAP_SITE_KEY:-iam-sso}
        UMI_APP_SSO_CAP_ENDPOINT: ${UMI_APP_SSO_CAP_ENDPOINT:-/api/iam/open/cap/iam-sso/}
        UMI_APP_SSO_CAP_WASM_URL: ${UMI_APP_SSO_CAP_WASM_URL:-/portal/cap/cap_wasm_bg.wasm}
        UMI_APP_SSO_CAP_PAKO_URL: ${UMI_APP_SSO_CAP_PAKO_URL:-/portal/cap/pako_inflate.min.js}
        UMI_APP_SSO_LOGIN_CREDENTIAL_KID: ${UMI_APP_SSO_LOGIN_CREDENTIAL_KID:-2026-05-primary}
        UMI_APP_SSO_LOGIN_CREDENTIAL_PUBLIC_KEY: ${UMI_APP_SSO_LOGIN_CREDENTIAL_PUBLIC_KEY:-04112ddd8854e8262db2520bba112535844884c03348a45fcf4ee0f9a967979be52bd46caf43be697ae557ed2e4fa5b4dca8d2dbfa08c0f2f710c0f61591bb17dc}
        UMI_APP_SSO_WELL_KNOWN_URL: ${UMI_APP_SSO_WELL_KNOWN_URL:-/sso/.well-known/authentication-configuration}
    restart: unless-stopped
    ports:
      - "${IAM_SSO_PUBLISHED_PORT:-30013}:80"

  admin:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
      args:
        <<: *build-proxy-args
        UMI_APP_ADMIN_API_PREFIX: ${UMI_APP_ADMIN_API_PREFIX:-/api/iam}
        UMI_APP_ADMIN_SSO_AUTHORIZE_URL: ${UMI_APP_ADMIN_SSO_AUTHORIZE_URL:-/sso/authorize}
        UMI_APP_ADMIN_SSO_LOGOUT_URL: ${UMI_APP_ADMIN_SSO_LOGOUT_URL:-/sso/logout}
        UMI_APP_ADMIN_CLIENT_CODE: ${UMI_APP_ADMIN_CLIENT_CODE:-iam-admin}
        UMI_APP_ADMIN_ROLE_CODE: ${UMI_APP_ADMIN_ROLE_CODE:-iam:admin}
        UMI_APP_ADMIN_GRAFANA_URL: ${UMI_APP_ADMIN_GRAFANA_URL:-http://localhost:30030}
        UMI_APP_ADMIN_SYSTEM_LOG_ENV: ${UMI_APP_ADMIN_SYSTEM_LOG_ENV:-dev}
    restart: unless-stopped
    ports:
      - "${IAM_ADMIN_PUBLISHED_PORT:-30014}:80"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      args: *build-proxy-args
    restart: unless-stopped
    labels:
      shgas-iam.logs.enabled: "true"
      shgas-iam.logs.env: dev
      shgas-iam.logs.service: api
      shgas-iam.logs.component: backend
    ports:
      - "${IAM_API_PUBLISHED_PORT:-30011}:30000"
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin-api:
    build:
      context: ..
      dockerfile: apps/admin-api/Dockerfile
      args: *build-proxy-args
    restart: unless-stopped
    labels:
      shgas-iam.logs.enabled: "true"
      shgas-iam.logs.env: dev
      shgas-iam.logs.service: admin-api
      shgas-iam.logs.component: backend
    ports:
      - "${IAM_ADMIN_API_PUBLISHED_PORT:-30012}:30001"
    environment: *admin-api-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  oidc-provider:
    build:
      context: ..
      dockerfile: apps/oidc-provider/Dockerfile
      args: *build-proxy-args
    restart: unless-stopped
    labels:
      shgas-iam.logs.enabled: "true"
      shgas-iam.logs.env: dev
      shgas-iam.logs.service: oidc-provider
      shgas-iam.logs.component: backend
    ports:
      - "${IAM_OIDC_PROVIDER_PUBLISHED_PORT:-30015}:30002"
    environment: *oidc-provider-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Consumes user-profile rebuild jobs; dashboard is intentionally disabled here.
  worker-user-profile:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
      args: *build-proxy-args
    restart: unless-stopped
    labels:
      shgas-iam.logs.enabled: "true"
      shgas-iam.logs.env: dev
      shgas-iam.logs.service: worker-user-profile
      shgas-iam.logs.component: backend-worker
    environment:
      <<: *worker-env
      IAM_WORKER_ENABLED_MODULES: ${IAM_WORKER_USER_PROFILE_ENABLED_MODULES:-user-profile}
      IAM_WORKER_BULL_BOARD_ENABLED: "false"
      IAM_WORKER_BULL_BOARD_QUEUES: ${IAM_WORKER_BULL_BOARD_QUEUES:-all}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Dashboard-only service; it shows known queues and does not consume jobs.
  worker-dashboard:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
      args: *build-proxy-args
    restart: unless-stopped
    labels:
      shgas-iam.logs.enabled: "true"
      shgas-iam.logs.env: dev
      shgas-iam.logs.service: worker-dashboard
      shgas-iam.logs.component: backend-worker
    ports:
      - "${IAM_WORKER_DASHBOARD_PUBLISHED_PORT:-30016}:30003"
    environment:
      <<: *worker-env
      IAM_WORKER_ENABLED_MODULES: "none"
      IAM_WORKER_BULL_BOARD_ENABLED: "true"
      IAM_WORKER_BULL_BOARD_QUEUES: ${IAM_WORKER_BULL_BOARD_QUEUES:-all}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  loki:
    image: ${LOKI_IMAGE:-docker.xuanyuan.run/grafana/loki:3.5.1}
    restart: unless-stopped
    profiles:
      - observability
    command:
      - -config.file=/etc/loki/loki.yaml
      - -config.expand-env=true
    ports:
      - "${LOKI_HTTP_PUBLISHED_PORT:-3100}:3100"
    volumes:
      - ../observability/loki/loki.dev.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki

  grafana:
    image: ${GRAFANA_IMAGE:-docker.xuanyuan.run/grafana/grafana-oss:12.0.2}
    restart: unless-stopped
    profiles:
      - observability
    ports:
      - "${GRAFANA_HTTP_PUBLISHED_PORT:-30030}:3000"
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:30030}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_AUTH_ANONYMOUS_ENABLED:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: ${GRAFANA_AUTH_ANONYMOUS_ORG_ROLE:-Admin}
      GF_AUTH_DISABLE_LOGIN_FORM: ${GRAFANA_AUTH_DISABLE_LOGIN_FORM:-false}
      GF_AUTH_GENERIC_OAUTH_ENABLED: ${GRAFANA_OIDC_ENABLED:-false}
      GF_AUTH_GENERIC_OAUTH_NAME: ${GRAFANA_OIDC_NAME:-IAM}
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: ${GRAFANA_OIDC_ALLOW_SIGN_UP:-true}
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_OIDC_CLIENT_ID:-grafana}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OIDC_CLIENT_SECRET:-}
      GF_AUTH_GENERIC_OAUTH_SCOPES: ${GRAFANA_OIDC_SCOPES:-openid profile}
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${GRAFANA_OIDC_AUTH_URL:-http://localhost:30080/oidc/auth}
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: ${GRAFANA_OIDC_TOKEN_URL:-http://host.docker.internal:30080/oidc/token}
      GF_AUTH_GENERIC_OAUTH_API_URL: ${GRAFANA_OIDC_USERINFO_URL:-http://host.docker.internal:30080/oidc/me}
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: ${GRAFANA_OIDC_USE_PKCE:-true}
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: ${GRAFANA_OIDC_LOGIN_ATTRIBUTE_PATH:-preferred_username}
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: ${GRAFANA_OIDC_NAME_ATTRIBUTE_PATH:-name}
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: ${GRAFANA_OIDC_EMAIL_ATTRIBUTE_PATH:-preferred_username}
      GF_USERS_ALLOW_SIGN_UP: ${GRAFANA_USERS_ALLOW_SIGN_UP:-true}
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: ${GRAFANA_AUTO_ASSIGN_ORG_ROLE:-Admin}
      GRAFANA_LOKI_URL: ${GRAFANA_LOKI_URL:-http://loki:3100}
      GRAFANA_DEV_ALERT_WEBHOOK_URL: ${GRAFANA_DEV_ALERT_WEBHOOK_URL:-http://127.0.0.1:9/iam-dev-null}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - grafana_data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki

  alloy:
    image: ${GRAFANA_ALLOY_IMAGE:-grafana/alloy:v1.9.2}
    restart: unless-stopped
    profiles:
      - observability
    command:
      - run
      - --stability.level=experimental
      - /etc/alloy/iam-logs.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    ports:
      - "${ALLOY_HTTP_PUBLISHED_PORT:-12345}:12345"
      - "${ALLOY_OTLP_HTTP_PUBLISHED_PORT:-4318}:4318"
    environment:
      ALLOY_LOG_LEVEL: ${ALLOY_LOG_LEVEL:-info}
      IAM_LOG_HOST: ${IAM_LOG_HOST:-dev-docker}
      LOKI_PUSH_URL: ${LOKI_PUSH_URL:-http://loki:3100/loki/api/v1/push}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
      - ../observability/alloy/iam-logs.dev.alloy:/etc/alloy/iam-logs.alloy:ro
    depends_on:
      - loki

volumes:
  db_data:
  redis_data:
  apisix_etcd_data:
  loki_data:
  grafana_data:
  alloy_data:
