x-build-proxy-args: &build-proxy-args
  HTTP_PROXY: ${DOCKER_BUILD_HTTP_PROXY:-}
  HTTPS_PROXY: ${DOCKER_BUILD_HTTPS_PROXY:-}
  NO_PROXY: ${DOCKER_BUILD_NO_PROXY:-}
  http_proxy: ${DOCKER_BUILD_HTTP_PROXY:-}
  https_proxy: ${DOCKER_BUILD_HTTPS_PROXY:-}
  no_proxy: ${DOCKER_BUILD_NO_PROXY:-}

services:
  db:
    image: docker.xuanyuan.run/postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: iam
      POSTGRES_PASSWORD: iam_password
      POSTGRES_DB: iam_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iam -d iam_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.xuanyuan.run/library/redis:latest
    restart: unless-stopped
    ports:
      - "6390:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  apisix-etcd:
    image: docker.xuanyuan.run/bitnamilegacy/etcd:3.5.11
    restart: unless-stopped
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: http://apisix-etcd:2379
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
    volumes:
      - apisix_etcd_data:/bitnami/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://127.0.0.1:2379"]
      interval: 10s
      timeout: 5s
      retries: 5

  apisix:
    image: docker.xuanyuan.run/apache/apisix:3.16.0-debian
    restart: unless-stopped
    labels:
      shgas-iam.logs.enabled: "true"
      shgas-iam.logs.env: dev
      shgas-iam.logs.service: apisix
      shgas-iam.logs.component: gateway
    ports:
      - "30080:9080"
      - "30443:9443"
      - "9180:9180"
    volumes:
      - ../gateway/config/config.dev.yaml:/usr/local/apisix/conf/config.yaml:ro
    depends_on:
      apisix-etcd:
        condition: service_healthy

  sso:
    build:
      context: ..
      dockerfile: apps/sso/Dockerfile
      args:
        <<: *build-proxy-args
        UMI_APP_LOGIN_CREDENTIAL_ALG: SM2-SM4-CBC
        UMI_APP_LOGIN_CREDENTIAL_KID: 2026-05-primary
        UMI_APP_LOGIN_CREDENTIAL_PUBLIC_KEY: 04112ddd8854e8262db2520bba112535844884c03348a45fcf4ee0f9a967979be52bd46caf43be697ae557ed2e4fa5b4dca8d2dbfa08c0f2f710c0f61591bb17dc
    restart: unless-stopped
    ports:
      - "30013:80"

  admin:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
      args: *build-proxy-args
    restart: unless-stopped
    ports:
      - "30014:80"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      args: *build-proxy-args
    restart: unless-stopped
    labels:
      shgas-iam.logs.enabled: "true"
      shgas-iam.logs.env: dev
      shgas-iam.logs.service: api
      shgas-iam.logs.component: backend
    ports:
      - "30011:30000"
    environment:
      DATABASE_URL: postgresql://iam:iam_password@db:5432/iam_db
      REDIS_URL: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      PORT: 30000
      NODE_ENV: production
      LOG_LEVEL: info
      LOG_FORMAT: json
      IAM_SECRET_KEY: shenergy2020
      PASSWORD_HASH_ROUNDS: 10
      DEFAULT_USER_PASSWORD: default123
      MAGIC_CODE: 1234
      CAP_ENABLED: true
      LOGIN_CREDENTIAL_ACTIVE_KID: 2026-05-primary
      LOGIN_CREDENTIAL_PRIVATE_KEYS_JSON: '{"2026-05-primary":"319b4e59ca80d7b4cc35955b63da4edf1ed51772ec8f33c0a4f769dda7b9fc65"}'
      LOGIN_CREDENTIAL_MAX_SKEW_MS: 300000
      LOGIN_CREDENTIAL_NONCE_TTL_SECONDS: 360
      WX_CORPID: "wwddf8d65300d53eb1"
      WX_CORPSECRET: "L41cYOgd-wmFEmoHPHXIL6ZHiP-hMzuXT_wsWINjAes"
      SMS_URL: "http://176.169.86.35:17111/v1/thirdparty/common/sms/sendMsg3"
      SMS_SIGNATURE_KEY: "aa8099eb32c945f39157f339d8fd702c"
      ORCAS_URL: "http://176.169.99.150:18091/orcas/login"
      PURVEYOR_PARENT_ORG: "GY"
      REDIS_EXPIRE_TIME: 86400
      AUTH_CODE_EXPIRE_TIME: 300
      LOGIN_ENDPOINT: /portal/login
      SSO_INTERNAL_ORIGIN: ${SSO_INTERNAL_ORIGIN:-http://localhost:30080}
      SSO_EXTERNAL_ORIGIN: ${SSO_EXTERNAL_ORIGIN:-http://localhost:39999}
      AUTHORIZATION_ENDPOINT: /sso/authorize
      LOGOUT_ENDPOINT: /sso/logout
      THIRDPARTY_OA_ENDPOINT: /sso/thirdparty/oa
      HTTP_PROXY: http://176.169.105.96:3928
      HTTPS_PROXY: http://176.169.105.96:3928
      NO_PROXY: localhost,127.0.0.1,176.169.99.191,176.169.99.95,180.50.65.131,192.168.0.0/16,176.169.99.125,176.169.86.35,176.169.99.150
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin-api:
    build:
      context: ..
      dockerfile: apps/admin-api/Dockerfile
      args: *build-proxy-args
    restart: unless-stopped
    labels:
      shgas-iam.logs.enabled: "true"
      shgas-iam.logs.env: dev
      shgas-iam.logs.service: admin-api
      shgas-iam.logs.component: backend
    ports:
      - "30012:30001"
    environment:
      DATABASE_URL: postgresql://iam:iam_password@db:5432/iam_db
      REDIS_URL: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      PORT: 30001
      NODE_ENV: production
      LOG_LEVEL: info
      PASSWORD_HASH_ROUNDS: 10
      ADMIN_CLIENT_CODES: iam-admin
      ADMIN_ROLE_CODES: iam:admin
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  oidc-provider:
    build:
      context: ..
      dockerfile: apps/oidc-provider/Dockerfile
      args: *build-proxy-args
    restart: unless-stopped
    labels:
      shgas-iam.logs.enabled: "true"
      shgas-iam.logs.env: dev
      shgas-iam.logs.service: oidc-provider
      shgas-iam.logs.component: backend
    ports:
      - "30015:30002"
    environment:
      DATABASE_URL: postgresql://iam:iam_password@db:5432/iam_db
      REDIS_URL: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      PORT: 30002
      NODE_ENV: development
      LOG_LEVEL: info
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:30080/oidc}
      OIDC_PUBLIC_ORIGIN: ${OIDC_PUBLIC_ORIGIN:-http://localhost:30080}
      OIDC_COOKIE_KEYS: ${OIDC_COOKIE_KEYS:?set OIDC_COOKIE_KEYS}
      OIDC_CURRENT_JWK_JSON: ${OIDC_CURRENT_JWK_JSON:?set OIDC_CURRENT_JWK_JSON}
      OIDC_PREVIOUS_JWK_JSON: ${OIDC_PREVIOUS_JWK_JSON:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  db_data:
  redis_data:
  apisix_etcd_data:
