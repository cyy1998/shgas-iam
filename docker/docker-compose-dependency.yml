services:
  db-mysql:
    image: docker.xuanyuan.run/mysql:8.0.39
    restart: unless-stopped
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: iam_db
      MYSQL_USER: iam
      MYSQL_PASSWORD: iam_password
    ports:
      - "5455:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
  db:
    image: docker.xuanyuan.run/postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: iam
      POSTGRES_PASSWORD: iam_password
      POSTGRES_DB: iam_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iam -d iam_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.xuanyuan.run/library/redis:latest
    restart: unless-stopped
    ports:
      - "6390:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  mysql_data:
  redis_data:
