# Production observability compose for centralized Loki/Grafana and per-host Alloy agents.
#
# Central observability host:
#   docker compose -f docker-compose-observability-prod.yml up -d loki grafana
#
# Each IAM service or gateway host:
#   docker compose -f docker-compose-observability-prod.yml up -d alloy

name: iam-service-observability

services:
  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.5.1}
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki.yaml
      - -config.expand-env=true
    ports:
      - "${LOKI_HTTP_PUBLISHED_HOST:-127.0.0.1}:${LOKI_HTTP_PUBLISHED_PORT:-3100}:3100"
    volumes:
      - ../observability/loki/loki.prod.yaml:/etc/loki/loki.yaml:ro
      - "${LOKI_DATA_PATH:-/data/loki}:/loki"

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana-oss:12.0.2}
    restart: unless-stopped
    ports:
      - "${GRAFANA_HTTP_PUBLISHED_PORT:-3000}:3000"
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:?set GRAFANA_ROOT_URL}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_DISABLE_LOGIN_FORM: ${GRAFANA_AUTH_DISABLE_LOGIN_FORM:-false}
      GF_AUTH_GENERIC_OAUTH_ENABLED: ${GRAFANA_OIDC_ENABLED:-true}
      GF_AUTH_GENERIC_OAUTH_NAME: ${GRAFANA_OIDC_NAME:-IAM}
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_OIDC_CLIENT_ID:-grafana}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OIDC_CLIENT_SECRET:?set GRAFANA_OIDC_CLIENT_SECRET}
      GF_AUTH_GENERIC_OAUTH_SCOPES: ${GRAFANA_OIDC_SCOPES:-openid profile}
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${GRAFANA_OIDC_AUTH_URL:?set GRAFANA_OIDC_AUTH_URL}
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: ${GRAFANA_OIDC_TOKEN_URL:?set GRAFANA_OIDC_TOKEN_URL}
      GF_AUTH_GENERIC_OAUTH_API_URL: ${GRAFANA_OIDC_USERINFO_URL:?set GRAFANA_OIDC_USERINFO_URL}
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: ${GRAFANA_OIDC_LOGIN_ATTRIBUTE_PATH:-preferred_username}
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: ${GRAFANA_OIDC_NAME_ATTRIBUTE_PATH:-name}
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: ${GRAFANA_OIDC_EMAIL_ATTRIBUTE_PATH:-preferred_username}
      GF_AUTH_SIGNOUT_REDIRECT_URL: ${GRAFANA_OIDC_SIGNOUT_REDIRECT_URL:-}
      GRAFANA_LOKI_URL: ${GRAFANA_LOKI_URL:-http://loki:3100}
      GRAFANA_DEV_ALERT_WEBHOOK_URL: ${GRAFANA_DEV_ALERT_WEBHOOK_URL:-http://127.0.0.1:9/iam-prod-null}
    volumes:
      - "${GRAFANA_DATA_PATH:-/data/grafana}:/var/lib/grafana"
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

  alloy:
    image: ${GRAFANA_ALLOY_IMAGE:-grafana/alloy:v1.9.2}
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/iam-logs.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    ports:
      - "${ALLOY_HTTP_PUBLISHED_HOST:-127.0.0.1}:${ALLOY_HTTP_PUBLISHED_PORT:-12345}:12345"
    environment:
      ALLOY_LOG_LEVEL: ${ALLOY_LOG_LEVEL:-info}
      IAM_LOG_HOST: ${IAM_LOG_HOST:?set IAM_LOG_HOST}
      LOKI_PUSH_URL: ${LOKI_PUSH_URL:?set LOKI_PUSH_URL}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - "${ALLOY_DATA_PATH:-/data/alloy}:/var/lib/alloy/data"
      - ../observability/alloy/iam-logs.prod.alloy:/etc/alloy/iam-logs.alloy:ro
