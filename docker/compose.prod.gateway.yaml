# 生产流量入口：APISIX 与其专属 etcd。Gateway API 位于 compose.prod.apps.yaml。
# docker compose --env-file docker/.env -f docker/compose.prod.gateway.yaml up -d apisix
# 与 data/apps 共用项目；项目级清理必须加载本机完整文件集，日常维护指定服务 stop/rm。
# APISIX_OTEL_COLLECTOR_ENDPOINT 必须指向可达的 Alloy 接收端。

name: iam-service-prod

services:
  apisix-etcd-init:
    image: ${APISIX_ETCD_IMAGE:-docker.xuanyuan.run/bitnamilegacy/etcd:3.5.11}
    user: "0"
    restart: "no"
    entrypoint:
      - sh
      - -ec
      - |
        install -d -m 0775 -o 1001 -g 0 /bitnami/etcd /bitnami/etcd/data
        chown -R 1001:0 /bitnami/etcd
    volumes:
      - "${APISIX_ETCD_DATA_PATH:-/data/apisix-etcd}:/bitnami/etcd"

  apisix-etcd:
    image: ${APISIX_ETCD_IMAGE:-docker.xuanyuan.run/bitnamilegacy/etcd:3.5.11}
    restart: unless-stopped
    environment:
      ALLOW_NONE_AUTHENTICATION: ${APISIX_ETCD_ALLOW_NONE_AUTHENTICATION:-no}
      ETCD_ROOT_PASSWORD: ${APISIX_ETCD_ROOT_PASSWORD:?set APISIX_ETCD_ROOT_PASSWORD}
      ETCD_ADVERTISE_CLIENT_URLS: ${APISIX_ETCD_ADVERTISE_CLIENT_URLS:-http://apisix-etcd:2379}
      ETCD_LISTEN_CLIENT_URLS: ${APISIX_ETCD_LISTEN_CLIENT_URLS:-http://0.0.0.0:2379}
    ports:
      - "${APISIX_ETCD_PUBLISHED_PORT:-2379}:2379"
    volumes:
      - "${APISIX_ETCD_DATA_PATH:-/data/apisix-etcd}:/bitnami/etcd"
    depends_on:
      apisix-etcd-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD-SHELL", 'etcdctl endpoint health --endpoints=http://127.0.0.1:2379 --user "root:$${ETCD_ROOT_PASSWORD}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  apisix:
    image: ${APISIX_IMAGE:-docker.xuanyuan.run/apache/apisix:3.16.0-debian}
    restart: unless-stopped
    labels:
      shgas-iam.logs.enabled: "true"
      shgas-iam.logs.env: ${IAM_LOG_ENV:-prod}
      shgas-iam.logs.service: apisix
      shgas-iam.logs.component: gateway
    ports:
      - "${APISIX_HTTP_PUBLISHED_PORT:-9080}:9080"
      - "${APISIX_HTTPS_PUBLISHED_PORT:-9443}:9443"
      - "${APISIX_ADMIN_PUBLISHED_HOST:-127.0.0.1}:${APISIX_ADMIN_PUBLISHED_PORT:-9180}:9180"
    environment:
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:?set APISIX_ADMIN_KEY}
      APISIX_ADMIN_ALLOW_CIDR: ${APISIX_ADMIN_ALLOW_CIDR:?set APISIX_ADMIN_ALLOW_CIDR}
      APISIX_ETCD_ENDPOINT: ${APISIX_ETCD_ENDPOINT:-http://apisix-etcd:2379}
      APISIX_ETCD_USER: ${APISIX_ETCD_USER:-root}
      APISIX_ETCD_PASSWORD: ${APISIX_ETCD_PASSWORD:-${APISIX_ETCD_ROOT_PASSWORD:?set APISIX_ETCD_ROOT_PASSWORD}}
      APISIX_OTEL_COLLECTOR_ENDPOINT: ${APISIX_OTEL_COLLECTOR_ENDPOINT:?set APISIX_OTEL_COLLECTOR_ENDPOINT}
    volumes:
      - "${APISIX_CONFIG_PATH:-./apisix/config.prod.example.yaml}:/usr/local/apisix/conf/config.yaml:ro"
    depends_on:
      apisix-etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "apisix", "status"]
      interval: 2s
      timeout: 3s
      retries: 30
