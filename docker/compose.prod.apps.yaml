# 生产自研应用：API、Admin API、SSO、Admin、Worker 与 Gateway API。
# 各主机按服务部署，使用可达的数据库、Redis 和 APISIX 地址。
# docker compose --env-file docker/.env -f docker/compose.prod.apps.yaml up -d api admin-api
# Gateway API 不编排 APISIX；发布前按 Gateway runbook 核验 APISIX 和只读数据库连接。
# 与 data/gateway 共用项目；项目级清理必须加载本机完整文件集，日常维护指定服务 stop/rm。

name: iam-service-prod

x-build-proxy-args: &build-proxy-args
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  NO_PROXY: ${NO_PROXY:-}
  http_proxy: ${http_proxy:-}
  https_proxy: ${https_proxy:-}
  no_proxy: ${no_proxy:-}

x-worker-environment: &worker-environment
  IAM_WORKER_DATABASE_URL: ${IAM_WORKER_DATABASE_URL:-postgresql://${POSTGRES_USER:-iam}:${POSTGRES_PASSWORD}@${POSTGRES_PRIMARY_HOST}:${POSTGRES_PRIMARY_PORT:-5432}/${POSTGRES_DB:-iam_db}}
  IAM_WORKER_REDIS_HOST: ${IAM_REDIS_HOST:?set IAM_REDIS_HOST}
  IAM_WORKER_REDIS_PORT: ${IAM_REDIS_PORT:-6379}
  IAM_WORKER_REDIS_PASSWORD: ${IAM_REDIS_PASSWORD:?set IAM_REDIS_PASSWORD}
  IAM_WORKER_REDIS_USERNAME: ${IAM_REDIS_USERNAME:-}
  IAM_WORKER_REDIS_DB: ${IAM_REDIS_DB:-0}
  NODE_ENV: production
  IAM_WORKER_LOG_LEVEL: ${IAM_LOG_LEVEL:-info}
  IAM_WORKER_LOG_FORMAT: ${IAM_LOG_FORMAT:-json}
  IAM_WORKER_HTTP_ENABLED: ${IAM_WORKER_HTTP_ENABLED:-true}
  IAM_WORKER_HTTP_PORT: 30003
  IAM_WORKER_HEALTH_PATH: ${IAM_WORKER_HEALTH_PATH:-/healthz}
  IAM_WORKER_BULL_BOARD_PATH: ${IAM_WORKER_BULL_BOARD_PATH:-/admin/queues}
  IAM_WORKER_BULL_BOARD_AUTH_ENABLED: ${IAM_WORKER_BULL_BOARD_AUTH_ENABLED:-true}
  IAM_WORKER_BULL_BOARD_READ_ONLY: ${IAM_WORKER_BULL_BOARD_READ_ONLY:-true}
  IAM_WORKER_USER_PROFILE_CONCURRENCY: ${IAM_WORKER_USER_PROFILE_CONCURRENCY:-2}
  IAM_WORKER_USER_PROFILE_REBUILD_BATCH_SIZE: ${IAM_WORKER_USER_PROFILE_REBUILD_BATCH_SIZE:-100}
  IAM_WORKER_USER_PROFILE_BACKFILL_BATCH_SIZE: ${IAM_WORKER_USER_PROFILE_BACKFILL_BATCH_SIZE:-500}
  IAM_WORKER_USER_PROFILE_REPAIR_STALE_SECONDS: ${IAM_WORKER_USER_PROFILE_REPAIR_STALE_SECONDS:-300}
  IAM_WORKER_ORGANIZATION_SEARCH_CONCURRENCY: ${IAM_WORKER_ORGANIZATION_SEARCH_CONCURRENCY:-2}
  IAM_WORKER_ORGANIZATION_SEARCH_BACKFILL_BATCH_SIZE: ${IAM_WORKER_ORGANIZATION_SEARCH_BACKFILL_BATCH_SIZE:-500}

services:
  api:
    image: ${IAM_API_IMAGE:-iam-api:1.0.0}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      args: *build-proxy-args
    restart: unless-stopped
    labels:
      shgas-iam.logs.enabled: "true"
      shgas-iam.logs.env: ${IAM_LOG_ENV:-prod}
      shgas-iam.logs.service: api
      shgas-iam.logs.component: backend
    ports:
      - "${IAM_API_PUBLISHED_PORT:-30000}:30000"
    environment:
      IAM_API_DATABASE_URL: ${IAM_API_DATABASE_URL:-postgresql://${POSTGRES_USER:-iam}:${POSTGRES_PASSWORD}@${POSTGRES_PRIMARY_HOST}:${POSTGRES_PRIMARY_PORT:-5432}/${POSTGRES_DB:-iam_db}}
      IAM_API_REDIS_HOST: ${IAM_REDIS_HOST:?set IAM_REDIS_HOST}
      IAM_API_REDIS_PORT: ${IAM_REDIS_PORT:-6379}
      IAM_API_REDIS_PASSWORD: ${IAM_REDIS_PASSWORD:?set IAM_REDIS_PASSWORD}
      IAM_API_REDIS_DB: ${IAM_REDIS_DB:-0}
      IAM_API_PORT: 30000
      NODE_ENV: production
      IAM_API_LOG_LEVEL: ${IAM_LOG_LEVEL:-info}
      IAM_API_LOG_FORMAT: ${IAM_LOG_FORMAT:-json}
      IAM_API_PASSWORD_HASH_ROUNDS: ${IAM_API_PASSWORD_HASH_ROUNDS:-10}
      IAM_API_MAGIC_CODE: ${IAM_API_MAGIC_CODE:?set IAM_API_MAGIC_CODE}
      IAM_API_CAP_ENABLED: ${IAM_API_CAP_ENABLED:-true}
      IAM_API_CAP_SITE_KEY: ${IAM_API_CAP_SITE_KEY:-iam-sso}
      IAM_API_CAP_SECRET: ${IAM_API_CAP_SECRET:?set IAM_API_CAP_SECRET}
      IAM_API_CAP_CHALLENGE_TTL_MS: ${IAM_API_CAP_CHALLENGE_TTL_MS:-600000}
      IAM_API_CAP_TOKEN_TTL_SECONDS: ${IAM_API_CAP_TOKEN_TTL_SECONDS:-600}
      IAM_API_HUMAN_VERIFICATION_WINDOW_SECONDS: ${IAM_API_HUMAN_VERIFICATION_WINDOW_SECONDS:-600}
      IAM_API_HUMAN_VERIFICATION_LOGIN_FAILURE_THRESHOLD: ${IAM_API_HUMAN_VERIFICATION_LOGIN_FAILURE_THRESHOLD:-3}
      IAM_API_HUMAN_VERIFICATION_LOOKUP_THRESHOLD: ${IAM_API_HUMAN_VERIFICATION_LOOKUP_THRESHOLD:-20}
      IAM_API_LOGIN_CREDENTIAL_ACTIVE_KID: ${IAM_API_LOGIN_CREDENTIAL_ACTIVE_KID:?set IAM_API_LOGIN_CREDENTIAL_ACTIVE_KID}
      IAM_API_LOGIN_CREDENTIAL_PRIVATE_KEYS_JSON: ${IAM_API_LOGIN_CREDENTIAL_PRIVATE_KEYS_JSON:?set IAM_API_LOGIN_CREDENTIAL_PRIVATE_KEYS_JSON}
      IAM_API_LOGIN_CREDENTIAL_MAX_SKEW_MS: ${IAM_API_LOGIN_CREDENTIAL_MAX_SKEW_MS:-300000}
      IAM_API_LOGIN_CREDENTIAL_NONCE_TTL_SECONDS: ${IAM_API_LOGIN_CREDENTIAL_NONCE_TTL_SECONDS:-360}
      IAM_API_SESSION_KERNEL_NAMESPACE: ${IAM_SESSION_KERNEL_NAMESPACE:-iam:session}
      IAM_API_WECHAT_CORP_ID: ${IAM_API_WECHAT_CORP_ID:?set IAM_API_WECHAT_CORP_ID}
      IAM_API_WECHAT_CORP_SECRET: ${IAM_API_WECHAT_CORP_SECRET:?set IAM_API_WECHAT_CORP_SECRET}
      IAM_API_SMS_URL: ${IAM_API_SMS_URL:?set IAM_API_SMS_URL}
      IAM_API_SMS_SIGNATURE_KEY: ${IAM_API_SMS_SIGNATURE_KEY:?set IAM_API_SMS_SIGNATURE_KEY}
      IAM_API_USER_SESSION_TTL_SECONDS: ${IAM_API_USER_SESSION_TTL_SECONDS:-86400}
      IAM_API_CLIENT_SESSION_TTL_SECONDS: ${IAM_API_CLIENT_SESSION_TTL_SECONDS:-86400}
      IAM_API_CUSTOM_SSO_TOKEN_TTL_SECONDS: ${IAM_API_CUSTOM_SSO_TOKEN_TTL_SECONDS:-86400}
      IAM_API_AUTH_CODE_TTL_SECONDS: ${IAM_API_AUTH_CODE_TTL_SECONDS:-300}
      IAM_API_CUSTOM_SSO_PROJECTION_RETRY_AFTER_SECONDS: ${IAM_API_CUSTOM_SSO_PROJECTION_RETRY_AFTER_SECONDS:-3}
      IAM_API_LOGIN_ENDPOINT: ${IAM_API_LOGIN_ENDPOINT:-/portal/login}
      IAM_API_SSO_INTERNAL_ORIGIN: ${IAM_API_SSO_INTERNAL_ORIGIN:?set IAM_API_SSO_INTERNAL_ORIGIN}
      IAM_API_SSO_EXTERNAL_ORIGIN: ${IAM_API_SSO_EXTERNAL_ORIGIN:?set IAM_API_SSO_EXTERNAL_ORIGIN}
      IAM_API_AUTHORIZATION_ENDPOINT: ${IAM_API_AUTHORIZATION_ENDPOINT:-/sso/authorize}
      IAM_API_LOGOUT_ENDPOINT: ${IAM_API_LOGOUT_ENDPOINT:-/sso/logout}
      IAM_API_THIRDPARTY_OA_ENDPOINT: ${IAM_API_THIRDPARTY_OA_ENDPOINT:-/sso/thirdparty/oa}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres-primary,redis,apisix,apisix-etcd}

      IAM_API_OIDC_CURRENT_JWK_JSON: ${IAM_API_OIDC_CURRENT_JWK_JSON:?set IAM_API_OIDC_CURRENT_JWK_JSON}
      IAM_API_OIDC_PREVIOUS_JWK_JSON: ${IAM_API_OIDC_PREVIOUS_JWK_JSON:-}
      IAM_API_OIDC_AUTHORIZATION_CODE_TTL_SECONDS: ${IAM_API_OIDC_AUTHORIZATION_CODE_TTL_SECONDS:-300}
      IAM_API_OIDC_CONTINUATION_TTL_SECONDS: ${IAM_API_OIDC_CONTINUATION_TTL_SECONDS:-600}
      IAM_API_OIDC_TOKEN_TTL_SECONDS: ${IAM_API_OIDC_TOKEN_TTL_SECONDS:-3600}
      IAM_API_OIDC_COOKIE_SECURE: ${IAM_API_OIDC_COOKIE_SECURE:-true}
      IAM_API_OIDC_NAMESPACE: ${IAM_API_OIDC_NAMESPACE:-iam:oidc}
      IAM_API_OIDC_TRUST_PROXY: ${IAM_API_OIDC_TRUST_PROXY:-true}
      IAM_API_OIDC_LOGOUT_CONFIRMATION_TTL_SECONDS: ${IAM_API_OIDC_LOGOUT_CONFIRMATION_TTL_SECONDS:-600}

  admin-api:
    image: ${IAM_ADMIN_API_IMAGE:-iam-admin-api:1.0.0}
    build:
      context: ..
      dockerfile: apps/admin-api/Dockerfile
      args: *build-proxy-args
    restart: unless-stopped
    labels:
      shgas-iam.logs.enabled: "true"
      shgas-iam.logs.env: ${IAM_LOG_ENV:-prod}
      shgas-iam.logs.service: admin-api
      shgas-iam.logs.component: backend
    ports:
      - "${IAM_ADMIN_API_PUBLISHED_PORT:-30001}:30001"
    environment:
      IAM_ADMIN_API_DATABASE_URL: ${IAM_ADMIN_API_DATABASE_URL:-postgresql://${POSTGRES_USER:-iam}:${POSTGRES_PASSWORD}@${POSTGRES_PRIMARY_HOST}:${POSTGRES_PRIMARY_PORT:-5432}/${POSTGRES_DB:-iam_db}}
      IAM_ADMIN_API_REDIS_HOST: ${IAM_REDIS_HOST:?set IAM_REDIS_HOST}
      IAM_ADMIN_API_REDIS_PORT: ${IAM_REDIS_PORT:-6379}
      IAM_ADMIN_API_REDIS_PASSWORD: ${IAM_REDIS_PASSWORD:?set IAM_REDIS_PASSWORD}
      IAM_ADMIN_API_REDIS_DB: ${IAM_REDIS_DB:-0}
      IAM_ADMIN_API_PORT: 30001
      NODE_ENV: production
      IAM_ADMIN_API_LOG_LEVEL: ${IAM_LOG_LEVEL:-info}
      IAM_ADMIN_API_LOG_FORMAT: ${IAM_LOG_FORMAT:-json}
      IAM_ADMIN_API_PASSWORD_HASH_ROUNDS: ${IAM_ADMIN_API_PASSWORD_HASH_ROUNDS:-10}
      IAM_ADMIN_API_ADMIN_CLIENT_CODES: ${IAM_ADMIN_API_ADMIN_CLIENT_CODES:-iam-admin}
      IAM_ADMIN_API_SESSION_KERNEL_NAMESPACE: ${IAM_SESSION_KERNEL_NAMESPACE:-iam:session}
      IAM_ADMIN_API_USER_SESSION_TTL_SECONDS: ${IAM_API_USER_SESSION_TTL_SECONDS:-86400}
      IAM_ADMIN_API_CLIENT_SESSION_TTL_SECONDS: ${IAM_API_CLIENT_SESSION_TTL_SECONDS:-86400}
      IAM_ADMIN_API_SSO_INTERNAL_ORIGIN: ${IAM_API_SSO_INTERNAL_ORIGIN:-http://localhost:30080}
      IAM_ADMIN_API_SSO_EXTERNAL_ORIGIN: ${IAM_API_SSO_EXTERNAL_ORIGIN:-http://localhost:39999}

  # Consumes user-profile rebuild jobs; dashboard is intentionally disabled here.
  worker-user-profile:
    image: ${IAM_WORKER_IMAGE:-iam-worker:1.0.0}
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
      args: *build-proxy-args
    restart: unless-stopped
    labels:
      shgas-iam.logs.enabled: "true"
      shgas-iam.logs.env: ${IAM_LOG_ENV:-prod}
      shgas-iam.logs.service: worker-user-profile
      shgas-iam.logs.component: backend-worker
    environment:
      <<: *worker-environment
      IAM_WORKER_ENABLED_MODULES: ${IAM_WORKER_USER_PROFILE_ENABLED_MODULES:-user-profile}
      IAM_WORKER_BULL_BOARD_ENABLED: "false"
      IAM_WORKER_BULL_BOARD_QUEUES: ${IAM_WORKER_BULL_BOARD_QUEUES:-all}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres-primary,redis,apisix,apisix-etcd}

  # Independent Organization Search consumer; no User Profile publishing or dashboard.
  worker-organization-search:
    image: ${IAM_WORKER_IMAGE:-iam-worker:1.0.0}
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
      args: *build-proxy-args
    restart: unless-stopped
    labels:
      shgas-iam.logs.enabled: "true"
      shgas-iam.logs.env: ${IAM_LOG_ENV:-prod}
      shgas-iam.logs.service: worker-organization-search
      shgas-iam.logs.component: backend-worker
    environment:
      <<: *worker-environment
      IAM_WORKER_ENABLED_MODULES: organization-search
      IAM_WORKER_BULL_BOARD_ENABLED: "false"
      IAM_WORKER_BULL_BOARD_QUEUES: ${IAM_WORKER_BULL_BOARD_QUEUES:-all}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres-primary,redis,apisix,apisix-etcd}

  # Dashboard-only service; starts only with the ops profile and does not consume jobs.
  worker-dashboard:
    image: ${IAM_WORKER_IMAGE:-iam-worker:1.0.0}
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
      args: *build-proxy-args
    restart: unless-stopped
    profiles:
      - ops
    labels:
      shgas-iam.logs.enabled: "true"
      shgas-iam.logs.env: ${IAM_LOG_ENV:-prod}
      shgas-iam.logs.service: worker-dashboard
      shgas-iam.logs.component: backend-worker
    ports:
      - "${IAM_WORKER_DASHBOARD_PUBLISHED_HOST:-127.0.0.1}:${IAM_WORKER_DASHBOARD_PUBLISHED_PORT:-30003}:30003"
    environment:
      <<: *worker-environment
      IAM_WORKER_ENABLED_MODULES: "none"
      IAM_WORKER_BULL_BOARD_ENABLED: "true"
      IAM_WORKER_BULL_BOARD_QUEUES: ${IAM_WORKER_BULL_BOARD_QUEUES:-all}
      IAM_WORKER_BULL_BOARD_USERNAME: ${IAM_WORKER_BULL_BOARD_USERNAME:?set IAM_WORKER_BULL_BOARD_USERNAME}
      IAM_WORKER_BULL_BOARD_PASSWORD: ${IAM_WORKER_BULL_BOARD_PASSWORD:?set IAM_WORKER_BULL_BOARD_PASSWORD}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres-primary,redis,apisix,apisix-etcd}

  sso:
    image: ${IAM_SSO_IMAGE:-iam-sso:1.0.0}
    build:
      context: ..
      dockerfile: apps/sso/Dockerfile
      args:
        <<: *build-proxy-args
        UMI_APP_SSO_API_PREFIX: ${UMI_APP_SSO_API_PREFIX:-/api/iam}
        UMI_APP_SSO_CLIENT_CODE: ${UMI_APP_SSO_CLIENT_CODE:-iam}
        UMI_APP_SSO_CAP_SITE_KEY: ${UMI_APP_SSO_CAP_SITE_KEY:-iam-sso}
        UMI_APP_SSO_CAP_ENDPOINT: ${UMI_APP_SSO_CAP_ENDPOINT:-/api/iam/open/cap/iam-sso/}
        UMI_APP_SSO_CAP_WASM_URL: ${UMI_APP_SSO_CAP_WASM_URL:-/portal/cap/cap_wasm_bg.wasm}
        UMI_APP_SSO_CAP_PAKO_URL: ${UMI_APP_SSO_CAP_PAKO_URL:-/portal/cap/pako_inflate.min.js}
        UMI_APP_SSO_LOGIN_CREDENTIAL_KID: ${UMI_APP_SSO_LOGIN_CREDENTIAL_KID:?set UMI_APP_SSO_LOGIN_CREDENTIAL_KID}
        UMI_APP_SSO_LOGIN_CREDENTIAL_PUBLIC_KEY: ${UMI_APP_SSO_LOGIN_CREDENTIAL_PUBLIC_KEY:?set UMI_APP_SSO_LOGIN_CREDENTIAL_PUBLIC_KEY}
        UMI_APP_SSO_WELL_KNOWN_URL: ${UMI_APP_SSO_WELL_KNOWN_URL:-/sso/.well-known/authentication-configuration}
    restart: unless-stopped
    ports:
      - "${IAM_SSO_PUBLISHED_PORT:-30013}:80"

  admin:
    image: ${IAM_ADMIN_IMAGE:-iam-admin:1.0.0}
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
      args:
        <<: *build-proxy-args
        UMI_APP_ADMIN_API_PREFIX: ${UMI_APP_ADMIN_API_PREFIX:-/api/iam}
        UMI_APP_ADMIN_SSO_AUTHORIZE_URL: ${UMI_APP_ADMIN_SSO_AUTHORIZE_URL:-/sso/authorize}
        UMI_APP_ADMIN_SSO_LOGOUT_URL: ${UMI_APP_ADMIN_SSO_LOGOUT_URL:-/sso/logout}
        UMI_APP_ADMIN_CLIENT_CODE: ${UMI_APP_ADMIN_CLIENT_CODE:-iam-admin}
        UMI_APP_ADMIN_GRAFANA_URL: ${UMI_APP_ADMIN_GRAFANA_URL:?set UMI_APP_ADMIN_GRAFANA_URL}
        UMI_APP_ADMIN_SYSTEM_LOG_ENV: ${UMI_APP_ADMIN_SYSTEM_LOG_ENV:-prod}
    restart: unless-stopped
    ports:
      - "${IAM_ADMIN_PUBLISHED_PORT:-30014}:80"

  gateway-api:
    image: ${IAM_GATEWAY_IMAGE:-iam-gateway:1.0.0}
    build:
      context: ..
      dockerfile: apps/gateway/Dockerfile
    restart: unless-stopped
    # Covers the maximum permitted Gateway shutdown deadline (300 seconds).
    stop_grace_period: 310s
    ports:
      - "${IAM_GATEWAY_PUBLISHED_HOST:-127.0.0.1}:${IAM_GATEWAY_PUBLISHED_PORT:-30004}:30004"
    environment:
      IAM_GATEWAY_DATABASE_URL: ${IAM_GATEWAY_DATABASE_URL:?set IAM_GATEWAY_DATABASE_URL to a dedicated IAM read-only credential}
      IAM_GATEWAY_APISIX_ADMIN_URL: ${IAM_GATEWAY_APISIX_ADMIN_URL:-http://apisix:9180/apisix/admin}
      IAM_GATEWAY_APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:?set APISIX_ADMIN_KEY}
      IAM_GATEWAY_HOSTNAME: 0.0.0.0
      IAM_GATEWAY_PORT: "30004"
      IAM_GATEWAY_MAX_REQUEST_BYTES: ${IAM_GATEWAY_MAX_REQUEST_BYTES:-1048576}
      IAM_GATEWAY_OPERATION_TIMEOUT_MS: ${IAM_GATEWAY_OPERATION_TIMEOUT_MS:-60000}
      IAM_GATEWAY_APISIX_REQUEST_TIMEOUT_MS: ${IAM_GATEWAY_APISIX_REQUEST_TIMEOUT_MS:-10000}
      IAM_GATEWAY_SHUTDOWN_TIMEOUT_MS: ${IAM_GATEWAY_SHUTDOWN_TIMEOUT_MS:-70000}
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:30004/health');if(!r.ok)process.exit(1)"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
