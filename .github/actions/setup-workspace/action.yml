name: Setup workspace
description: Install pnpm, Node 24.22.3, Bun 1.4.4, optional Turbo cache, dependencies, and optional Playwright Chromium

inputs:
  turbo-cache-scope:
    description: Optional Turbo cache scope name (empty to skip Turbo cache)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "24.22.3"
        cache: pnpm
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.4.4"
    - if: ${{ inputs.turbo-cache-scope != '' }}
      uses: actions/cache@v4
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ inputs.turbo-cache-scope }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ inputs.turbo-cache-scope }}-
          turbo-${{ runner.os }}-
    - shell: bash
      env:
        HUSKY: "0"
      run: pnpm install --frozen-lockfile
