apiVersion: 1

groups:
  - orgId: 1
    name: IAM System Log Alerts
    folder: IAM Observability
    interval: 1m
    rules:
      - uid: iam-service-error-spike
        title: IAM service error spike
        condition: C
        data:
          - refId: A
            datasourceUid: iam-loki
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: sum by (service) (count_over_time({env=~"$env", service=~"api|admin-api|oidc-provider", level=~"error|fatal"}[5m]))
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              expression: A
              type: threshold
              conditions:
                - evaluator:
                    params: [5]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: IAM service emitted elevated error logs.
        labels:
          severity: warning

      - uid: iam-apisix-5xx-spike
        title: APISIX 5xx spike
        condition: C
        data:
          - refId: A
            datasourceUid: iam-loki
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: sum(count_over_time({service="apisix"} | json | statusCode >= 500 [5m]))
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              expression: A
              type: threshold
              conditions:
                - evaluator:
                    params: [3]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: APISIX emitted elevated 5xx access logs.
        labels:
          severity: warning

      - uid: iam-oidc-provider-server-error
        title: OIDC provider server error
        condition: C
        data:
          - refId: A
            datasourceUid: iam-loki
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: sum(count_over_time({service="oidc-provider", level=~"error|fatal"} | json | event=~"oidc.provider.server_error|oidc.provider.protocol_error" [5m]))
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              expression: A
              type: threshold
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: OIDC provider emitted protocol or server errors.
        labels:
          severity: critical

      - uid: iam-log-collection-failure
        title: Loki or Alloy collection failure
        condition: C
        data:
          - refId: A
            datasourceUid: iam-loki
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: sum(count_over_time({service=~"api|admin-api|oidc-provider|apisix"}[10m]))
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              expression: A
              type: threshold
              conditions:
                - evaluator:
                    params: [1]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                  type: query
              refId: C
        noDataState: Alerting
        execErrState: Error
        for: 10m
        annotations:
          summary: IAM log volume dropped to zero; Loki or Alloy collection may be failing.
        labels:
          severity: warning
