schema: spec-driven

context: |
  语言：中文（简体）
  所有 OpenSpec 产出物必须用简体中文撰写。

  但请遵守：
  - 文件名、路径、代码标识符保持英文
  - API、REST、tRPC、GraphQL、JWT、OAuth、Bun、Hono、Drizzle、PostgreSQL 等通用技术术语保持英文
  - Given / When / Then、ADDED / MODIFIED / REMOVED、SHALL / MUST 等 OpenSpec 结构关键词保持英文
  - 代码示例、命令、配置项保持原样

  项目背景：
  - 本仓库是 pnpm workspace + Turborepo monorepo。
  - 后端主要使用 TypeScript、Bun、Hono、Drizzle ORM 和 PostgreSQL。
  - 前端主要使用 Umi Max + React。
  - OpenSpec 产物应聚焦需求、设计和任务，不要混入实现外的无关重构。

rules:
  proposal:
    - 保持简洁，优先说明为什么需要变更、变更范围和影响面。
    - 不要把实现步骤写进 proposal；实现细节放在 design 或 tasks。
  design:
    - 聚焦关键技术决策、约束、风险和取舍。
    - 如果变更只影响测试或文档，应明确不改变运行时行为。
  specs:
    - Requirement 和 Scenario 必须可验证。
    - 修改已有 capability 时优先使用既有 spec 名称。
  tasks:
    - 每个任务必须使用可被 OpenSpec 追踪的复选框格式。
    - 任务应按依赖顺序排列，并保持可在单次实现会话中完成。
