server {
  listen 80;
  server_name _;
  absolute_redirect off;
  root /usr/share/nginx/html;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /iam-admin {
    return 301 /iam-admin/;
  }

  location /iam-admin/ {
    try_files $uri $uri/ /iam-admin/index.html;
  }

  location / {
    return 404;
  }
}
