server {
  listen 80;
  server_name _;
  absolute_redirect off;
  port_in_redirect off;
  root /usr/share/nginx/html;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /iam-admin {
    return 301 /iam-admin/;
  }

  location = /iam-admin/index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
  }

  location ~* ^/iam-admin/.+\.[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]\.(?:js|css|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|eot|wasm)$ {
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location ~* ^/iam-admin/.+\.(?:js|css|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|eot|wasm)$ {
    access_log off;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location /iam-admin/ {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri $uri/ /iam-admin/index.html;
  }

  location / {
    return 404;
  }
}
