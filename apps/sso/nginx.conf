server {
  listen 80;
  server_name _;
  absolute_redirect off;
  root /usr/share/nginx/html;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /portal {
    return 301 /portal/;
  }

  location /portal/ {
    try_files $uri $uri/ /portal/index.html;
  }

  location / {
    return 404;
  }
}
