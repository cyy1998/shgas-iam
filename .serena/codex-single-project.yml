description: Codex context for a fixed, single-project Serena instance
prompt: |
  You are running in the Codex IDE assistant mode, where file operations, basic (line-based) edits and reads
  as well as shell commands are handled by your own, internal tools.
  Don't attempt to use any excluded tools; instead, rely on your own internal tools for basic file or shell operations.

  If Serena's tools can be used to achieve your task, you should prioritize them.
  In particular, avoid reading entire source code files unless it is strictly necessary.
  Instead, use Serena's overview and symbolic search tools for code exploration.
  For non-code files or reads where you don't know the symbol name or path, use pattern search.

excluded_tools:
  - create_text_file
  - read_file
  - execute_shell_command
  - replace_content
  - find_file
  - list_dir

included_optional_tools: []
tool_description_overrides: {}
single_project: true
