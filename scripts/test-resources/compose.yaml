services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: iam_test
      POSTGRES_PASSWORD: iam_test
      POSTGRES_DB: iam_test
    ports:
      - "127.0.0.1::5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "iam_test", "-d", "iam_test"]
      interval: 1s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8.8.0-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1::6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
