services:
  postgres:
    image: postgres:18.4-alpine
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - max_wal_size=2GB
      - -c
      - checkpoint_timeout=15min
    environment:
      POSTGRES_USER: iam_test
      POSTGRES_PASSWORD: iam_test
      POSTGRES_DB: iam_test
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql:size=1g
    healthcheck:
      # Initialization uses a temporary Unix socket; consumers need the final TCP listener.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "iam_test", "-d", "iam_test"]
      interval: 1s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8.8.0-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--databases", "32"]
    ports:
      - "127.0.0.1::6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
